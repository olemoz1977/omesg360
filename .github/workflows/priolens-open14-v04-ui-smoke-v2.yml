name: PrioLens Open14 v0.4 local A+ B+ UI smoke v2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/priolens-open14-v04
      - cleanup/priolens-v04-remove-ship-map
    paths:
      - 'priolens/open14-v04/ui_smoke_v04.mjs'
      - 'priolens/open14-v04/adaptive_clarifiers_v04.mjs'
      - 'priolens/open14-v04/build_from_v031.mjs'
      - 'priolens/open14-v04/result_shell_v04.mjs'
      - 'priolens/open14-v04/result_renderer_v04.mjs'
      - '.github/workflows/priolens-open14-v04-ui-smoke-v2.yml'

permissions:
  contents: read

jobs:
  local-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and unit smoke
        run: |
          node priolens/open14-v04/adaptive_clarifiers_v04.test.mjs
          node priolens/open14-v04/build_from_v031.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run 390x844 A+ and B+ flow with resume checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory priolens/open14-v04 >/tmp/priolens-v04-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node priolens/open14-v04/ui_smoke_v04.mjs
