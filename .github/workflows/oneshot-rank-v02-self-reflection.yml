name: One-shot Rank v0.2 self reflection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-rank-v02-self-reflection.yml

permissions:
  contents: write

concurrency:
  group: oneshot-rank-v02-self-reflection
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Patch and validate reflection layer
        run: |
          python scripts/patch-rank-v02-self-reflection.py
          node --check /tmp/rank-v02.mjs
          git restore .github/workflows/deploy-priolens-open14-rank-v02.yml

      - name: Commit source
        run: |
          git config user.name olemoz1977
          git config user.email olemoz1977@gmail.com
          git add priolens/open14-rank-v02/index.html
          git commit -m "Complete Rank v0.2 self-reflection loop"
          git push origin HEAD:main
