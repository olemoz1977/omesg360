name: Smoke PrioLens bilingual API once v01

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/smoke-priolens-bilingual-api-once-v01.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build EN synthetic payloads
        shell: bash
        run: |
          set -euo pipefail
          node priolens/open14-v02/tools/make_autosave_smoke_payload.mjs
          python - <<'PY'
          import json
          uuid='00000000-0000-4000-8000-000000000003'
          for p in ['/tmp/priolens-partial.json','/tmp/priolens-final.json']:
              x=json.load(open(p))
              x['sessionUuid']=uuid
              x['language']='en'
              with open(p,'w') as f: json.dump(x,f,separators=(',',':'))
          PY
      - name: EN partial checkpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Content-Type: application/json' --data-binary @/tmp/priolens-partial.json \
            https://omesg360.eu/priolens-open14-api/progress.php | tee /tmp/partial-response.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/partial-response.json'))
          assert x.get('ok') is True, x
          print('EN_PARTIAL_OK')
          PY
      - name: EN final submission
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Content-Type: application/json' --data-binary @/tmp/priolens-final.json \
            https://omesg360.eu/priolens-open14-api/api.php | tee /tmp/final-response.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/final-response.json'))
          assert x.get('ok') is True, x
          print('EN_FINAL_OK', x.get('inserted'))
          PY
      - name: Stale EN partial cannot overwrite final
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Content-Type: application/json' --data-binary @/tmp/priolens-partial.json \
            https://omesg360.eu/priolens-open14-api/progress.php | tee /tmp/stale-response.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/stale-response.json'))
          assert x.get('ok') is True, x
          assert x.get('completedAlready') is True, x
          print('EN_STALE_PROTECTED_OK')
          PY
