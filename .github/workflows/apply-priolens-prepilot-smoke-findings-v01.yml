name: Apply PrioLens pre-pilot smoke findings v01

on:
  push:
    branches: [main]
    paths:
      - priolens/open14-v02/tools/patch_prepilot_smoke_findings_v01.py
      - .github/workflows/apply-priolens-prepilot-smoke-findings-v01.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-open14-v02

jobs:
  patch-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply smoke-findings patch
        run: python priolens/open14-v02/tools/patch_prepilot_smoke_findings_v01.py

      - name: Validate runtime source
        shell: bash
        run: |
          set -euo pipefail
          f='priolens/open14-v02/index.html'
          grep -q 'id="exit2rasi"' "$f"
          grep -q "exit:'Išeiti'" "$f"
          grep -q "exit:'Exit'" "$f"
          grep -q 'input\[type=range\].noValue' "$f"
          grep -q "slider.classList.add('noValue')" "$f"
          grep -q "aria-valuetext',T.hardToSay" "$f"
          grep -q "$('exit2rasi').href=target" "$f"
          ! grep -q "classList.add('unset')" "$f"
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('priolens/open14-v02/index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>', h, re.S)
          if not m: raise SystemExit('module script not found')
          Path('/tmp/runtime.mjs').write_text(m.group(1))
          PY
          node --check /tmp/runtime.mjs
          echo 'PASS: pre-pilot smoke findings present and JS parses'

      - name: Commit runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v02/index.html
          git commit -m 'fix(priolens): clarify no-value slider and add persistent exit'
          git push origin HEAD:main

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Publish runtime
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; put -O \"$REMOTE_DIR/\" priolens/open14-v02/index.html"

      - name: Live source smoke
        shell: bash
        run: |
          set -euo pipefail
          url='https://omesg360.eu/priolens-open14-v02/'
          curl -fsS --retry 5 --retry-delay 2 "$url" -o /tmp/live
          grep -q 'id="exit2rasi"' /tmp/live
          grep -q 'input\[type=range\].noValue' /tmp/live
          grep -q "exit:'Exit'" /tmp/live
          grep -q "$('exit2rasi').href=target" /tmp/live
          echo 'PASS: smoke-findings runtime live'
