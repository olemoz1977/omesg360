name: Patch PrioLens owner review statuses

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-priolens-owner-review-statuses.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bank review metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('priolens/open14-v02/bank.json')
          b=json.loads(p.read_text())
          fam=b['families']
          def ex(fid,eid):
              return next(x for x in fam[fid]['exemplars'] if x['id']==eid)
          ex('CONNECTION','CONNECTION-A')['visualStatus']='CLEAN_REQUIRED_WATERMARK'
          ex('CONNECTION','CONNECTION-A')['risk']='KlingAI watermark detected in runtime asset; clean or replace with clean equivalent before external pilot'
          ex('CONNECTION','CONNECTION-B')['visualStatus']='CLEAN_REQUIRED_WATERMARK'
          ex('CONNECTION','CONNECTION-B')['risk']='watermark visually confirmed during owner smoke; clean or replace with clean equivalent before external pilot'
          ex('KNOWLEDGE','KNOWLEDGE-A')['semanticStatus']='REPLACE_SEARCH_BETTER_CANDIDATE'
          ex('KNOWLEDGE','KNOWLEDGE-A')['risk']='owner prefers a more direct learning/understanding cue; search Gallery for clearer book/learning candidate'
          ex('KNOWLEDGE','KNOWLEDGE-B')['semanticStatus']='REPLACE_SEARCH_BETTER_CANDIDATE'
          ex('KNOWLEDGE','KNOWLEDGE-B')['risk']='current see-clearer/more boundary probe is too broad; search for a clearer learning/understanding candidate, potentially digital learning'
          ex('OPPORTUNITY','OPPORTUNITY-A')['semanticStatus']='HOLD_SEARCH_BETTER_CANDIDATE'
          ex('OPPORTUNITY','OPPORTUNITY-A')['risk']='owner requested additional candidate search before freezing this exemplar'
          p.write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add priolens/open14-v02/bank.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(priolens): record owner stimulus review statuses'
          git push
