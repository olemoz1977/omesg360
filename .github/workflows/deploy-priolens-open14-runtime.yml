name: Deploy PrioLens Open14 runtime

on:
  push:
    branches: [main]
    paths:
      - priolens/open14-v02/index.html
      - priolens/open14-v02/bank.json
      - priolens/open14-v02/stimulus-bank.html
      - priolens/open14-v02/p3_open14_planner_v02.mjs
      - priolens/open14-v02/p3_open14_exemplar_assigner_v01.mjs
      - priolens/open14-v02/.htaccess
      - .github/workflows/deploy-priolens-open14-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omesg360-priolens-open14-runtime
  cancel-in-progress: false

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-open14-v02

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate runtime source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('priolens/open14-v02/bank.json').read_text())
          assert b['schema']=='2rasi.priolens.open14.bank-v0.2'
          assert b['status'] in {'READY_FOR_OWNER_SMOKE','PREPILOT_HARDENING'}
          assert b['missingRuntimeAssets']==[]
          for fid,fam in b['families'].items():
              assert len(fam['exemplars'])==2, fid
              for ex in fam['exemplars']:
                  assert ex.get('runtimePath'), ex['id']
          html=Path('priolens/open14-v02/index.html').read_text()
          for needle in [
              '<title>PrioLens · 2rasi</title>',
              'sessionUuid:crypto.randomUUID',
              '/priolens-open14-api/api.php',
              '/priolens-open14-api/progress.php',
              'DRAFT_KEY',
              "PARAMS.get('lang')",
              'Pirmas žvilgsnis. Antras atsakymas.',
              'Sunku pasakyti',
              'Hard to say',
              'Tyrimo prototipas',
              'Research prototype',
              'Išeiti',
              'Exit'
          ]:
              assert needle in html, needle
          owner=Path('priolens/open14-v02/stimulus-bank.html').read_text()
          for needle in ['Open14 stimulus bank','bank.json']:
              assert needle in owner, needle
          ht=Path('priolens/open14-v02/.htaccess').read_text()
          assert 'AddType application/javascript .mjs' in ht
          print('PASS: current bilingual participant surface, bank, owner map, autosave/API hooks and mjs MIME rule present')
          PY
          node -e "import('./priolens/open14-v02/p3_open14_planner_v02.mjs').then(m=>{const p=m.buildOpen14Plan('deploy-smoke'); if(!p.audit) process.exit(2); console.log('planner pass')})"
          node -e "import('./priolens/open14-v02/p3_open14_exemplar_assigner_v01.mjs').then(()=>console.log('assigner import pass'))"

      - name: Verify FTP secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FTP_USER:-}" ]] || { echo 'Missing HOSTINGER_FTP_USER' >&2; exit 1; }
          [[ -n "${FTP_PASSWORD:-}" ]] || { echo 'Missing HOSTINGER_FTP_PASSWORD' >&2; exit 1; }

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload managed runtime files only
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; set cmd:fail-exit no; mkdir -p \"$REMOTE_DIR\"; set cmd:fail-exit yes; put -O \"$REMOTE_DIR/\" priolens/open14-v02/index.html; put -O \"$REMOTE_DIR/\" priolens/open14-v02/bank.json; put -O \"$REMOTE_DIR/\" priolens/open14-v02/stimulus-bank.html; put -O \"$REMOTE_DIR/\" priolens/open14-v02/p3_open14_planner_v02.mjs; put -O \"$REMOTE_DIR/\" priolens/open14-v02/p3_open14_exemplar_assigner_v01.mjs; put -O \"$REMOTE_DIR/\" priolens/open14-v02/.htaccess"
          echo 'Uploaded isolated Open14 runtime only.'

      - name: HTTP smoke current participant surface and dependencies
        shell: bash
        run: |
          set -euo pipefail
          base='https://omesg360.eu/priolens-open14-v02'
          curl -fsS --retry 4 --retry-delay 2 "$base/?lang=lt&from=lt" -o /tmp/index-lt
          grep -Fq '<title>PrioLens · 2rasi</title>' /tmp/index-lt
          grep -Fq 'priolens-open14-api/api.php' /tmp/index-lt
          grep -Fq 'priolens-open14-api/progress.php' /tmp/index-lt
          grep -Fq 'Pirmas žvilgsnis. Antras atsakymas.' /tmp/index-lt
          grep -Fq 'Tyrimo prototipas' /tmp/index-lt
          grep -Fq 'Sunku pasakyti' /tmp/index-lt
          grep -Fq 'Išeiti' /tmp/index-lt
          grep -Fq 'Hard to say' /tmp/index-lt
          grep -Fq 'Research prototype' /tmp/index-lt
          curl -fsS --retry 4 --retry-delay 2 "$base/stimulus-bank.html" -o /tmp/stimulus-bank
          grep -q 'Open14 stimulus bank' /tmp/stimulus-bank
          curl -fsS --retry 4 --retry-delay 2 "$base/bank.json" -o /tmp/bank
          python - <<'PY'
          import json
          b=json.load(open('/tmp/bank'))
          assert b['status'] in {'READY_FOR_OWNER_SMOKE','PREPILOT_HARDENING'}
          assert not b['missingRuntimeAssets']
          assert all(ex.get('runtimePath') for f in b['families'].values() for ex in f['exemplars'])
          print('bank smoke pass')
          PY
          for f in p3_open14_planner_v02.mjs p3_open14_exemplar_assigner_v01.mjs; do
            curl -fsS --retry 4 --retry-delay 2 "$base/$f" -o /dev/null
            ct="$(curl -fsSI --retry 4 --retry-delay 2 "$base/$f" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}' | tail -1)"
            echo "$f content-type=$ct"
            case "$ct" in
              application/javascript*|text/javascript*) ;;
              *) echo "Bad module MIME for $f: $ct" >&2; exit 1;;
            esac
          done
          health="$(curl -fsS --retry 4 --retry-delay 2 'https://omesg360.eu/priolens-open14-api/health.php')"
          echo "$health" | grep -q '"ok":true'
          progress_code="$(curl -sS -o /tmp/progress-get -w '%{http_code}' 'https://omesg360.eu/priolens-open14-api/progress.php')"
          [[ "$progress_code" == '405' ]]
          curl -fsS --retry 4 --retry-delay 2 'https://omesg360.eu/priolens-research-assets/Open14-v02/priolens_care-a_v01.webp' -o /dev/null
          curl -fsS --retry 4 --retry-delay 2 'https://omesg360.eu/priolens-research-assets/Open14-v02/priolens_recognition-b_v01.webp' -o /dev/null
          curl -fsS --retry 4 --retry-delay 2 'https://omesg360.eu/priolens-research-assets/Open14-final-v01/control-a_joystick_v01.webp' -o /dev/null
          curl -fsS --retry 4 --retry-delay 2 'https://omesg360.eu/priolens-research-assets/Open14-final-v01/belonging-b_coffee-ritual_v01.webp' -o /dev/null
          curl -fsS --retry 4 --retry-delay 2 'https://omesg360.eu/priolens-research-assets/Open14-final-v01/exploration-b_magnifier-forest_v01.webp' -o /dev/null
          curl -fsS --retry 4 --retry-delay 2 'https://omesg360.eu/priolens-research-assets/Open14-final-v01/opportunity-a_open-market-stall_v01.webp' -o /dev/null
          echo 'PASS: current PrioLens participant surface, modules, bank, API health and final asset set reachable'

      - name: Historical runtime boundary smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 'https://omesg360.eu/priolens/' -o /tmp/old
          grep -Eq 'PrioLens P3|research-v0\.4|v0\.4' /tmp/old
          echo 'PASS: historical /priolens/ remains reachable'

# Deliberately isolated from historical /priolens/ and persistent research-assets.
