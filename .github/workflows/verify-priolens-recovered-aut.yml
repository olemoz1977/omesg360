name: Verify PrioLens recovered AUT asset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-priolens-recovered-aut.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: HTTP smoke AUT-B
        shell: bash
        run: |
          set -euo pipefail
          url='https://omesg360.eu/priolens-research-assets/Recovered/priolens_aut_backpack_v01.webp'
          curl -fsS --retry 4 --retry-delay 2 -o /tmp/aut.webp "$url"
          test -s /tmp/aut.webp
          file /tmp/aut.webp | grep -q 'Web/P image'
          echo "bytes=$(stat -c%s /tmp/aut.webp)"
          sha256sum /tmp/aut.webp
          echo 'PASS: AUT-B recovered asset reachable and valid WebP'
