name: Fix PrioLens Open14 literal newline regression

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-priolens-open14-literal-newlines.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-open14-v02

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix only introduced literal newline sequences
        shell: python
        run: |
          from pathlib import Path
          p = Path('priolens/open14-v02/index.html')
          s = p.read_text(encoding='utf-8')
          targets = [
            ('</p>\\n    <p class="note">Formative pilotui', '</p>\n    <p class="note">Formative pilotui'),
            ('</p>\\n    <p id="saveStatus"', '</p>\n    <p id="saveStatus"'),
            ("from './p3_open14_exemplar_assigner_v01.mjs';\\nconst API_PATH", "from './p3_open14_exemplar_assigner_v01.mjs';\nconst API_PATH"),
          ]
          for old, new in targets:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, got {count}: {old}')
            s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print('PASS: three literal newline regressions fixed')

      - name: Parse-check browser module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('priolens/open14-v02/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>', s, re.S)
          if not m: raise SystemExit('module script not found')
          Path('/tmp/open14-app.mjs').write_text(m.group(1), encoding='utf-8')
          if "\\nconst API_PATH" in s: raise SystemExit('literal newline still present before API_PATH')
          if '>\\n    <p' in s: raise SystemExit('literal newline still present in HTML paragraphs')
          PY
          node --check /tmp/open14-app.mjs
          grep -q "const API_PATH='/priolens-open14-api/api.php';" priolens/open14-v02/index.html
          grep -q "init();" priolens/open14-v02/index.html
          echo 'PASS: module parses'

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v02/index.html
          git commit -m 'Fix Open14 literal newline runtime regression'
          git push origin main

      - name: Verify FTP secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FTP_USER:-}" ]]
          [[ -n "${FTP_PASSWORD:-}" ]]

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy fixed index only
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; put -O \"$REMOTE_DIR/\" priolens/open14-v02/index.html"

      - name: Live regression smoke
        shell: bash
        run: |
          set -euo pipefail
          url='https://omesg360.eu/priolens-open14-v02/'
          curl -fsS --retry 5 --retry-delay 2 "$url?smoke=${GITHUB_RUN_ID}" -o /tmp/live.html
          grep -q "const API_PATH='/priolens-open14-api/api.php';" /tmp/live.html
          grep -q 'Open14 bankas paruoštas' /tmp/live.html || true
          if grep -Fq '\nconst API_PATH' /tmp/live.html; then echo 'literal JS newline still live' >&2; exit 1; fi
          if grep -Fq '>\n    <p' /tmp/live.html; then echo 'literal HTML newline still live' >&2; exit 1; fi
          echo 'PASS: live HTML regression removed'
