name: Build PrioLens Open14 geometry review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-priolens-geometry-review.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  ASSET_DIR: /domains/omesg360.eu/public_html/priolens-research-assets/Open14-geometry-v01
  REVIEW_DIR: /domains/omesg360.eu/public_html/priolens-geometry-review-v01

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow
      - name: Stage canonical portrait mirrors
        shell: bash
        run: |
          set -euo pipefail
          dst=/tmp/open14-geometry-review/src
          mkdir -p "$dst"
          cp priolens/gallery-review/open14-v01/20260730_215302742.png "$dst/"
          cp priolens/gallery-review/open14-v01/20260731_050136952.png "$dst/"
          cp priolens/gallery-review/open14-v01/20260730_230415808.png "$dst/"
          cp priolens/gallery-review/open14-v01/20260730_230227381.png "$dst/"
          cp priolens/gallery-review/open-spectrum-v01/20260731_043300801.png "$dst/"
      - name: Build deterministic crop review
        run: python priolens/open14-v02/tools/build_geometry_review.py
      - name: Validate review outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/open14-geometry-review/out/index.html
          test -s /tmp/open14-geometry-review/out/manifest.json
          [[ "$(find /tmp/open14-geometry-review/out -name '*.webp' | wc -l)" -eq 15 ]]
          grep -q 'REST-A' /tmp/open14-geometry-review/out/index.html
          grep -q 'KNOWLEDGE-A' /tmp/open14-geometry-review/out/index.html
      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Deploy review only
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST; set cmd:fail-exit no; mkdir -p \"$ASSET_DIR\"; mkdir -p \"$REVIEW_DIR\"; set cmd:fail-exit yes; mput -O \"$ASSET_DIR/\" /tmp/open14-geometry-review/out/*.webp; put -O \"$ASSET_DIR/\" /tmp/open14-geometry-review/out/manifest.json; put -O \"$REVIEW_DIR/\" /tmp/open14-geometry-review/out/index.html"
      - name: HTTP smoke review
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 'https://omesg360.eu/priolens-geometry-review-v01/' -o /tmp/review
          grep -q 'Open14 1:1 crop review' /tmp/review
          for f in rest-a_sq_top_v01.webp rest-a_sq_center_v01.webp rest-a_sq_bottom_v01.webp knowledge-a_sq_center_v01.webp belonging-b_sq_center_v01.webp; do
            curl -fsS --retry 4 --retry-delay 2 "https://omesg360.eu/priolens-research-assets/Open14-geometry-v01/$f" -o /dev/null
          done
          echo 'PASS: isolated geometry review live; production bank untouched'
