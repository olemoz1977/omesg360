name: Apply PrioLens result completion v01

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-priolens-result-completion-v01.yml

permissions:
  contents: write

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-open14-v02

jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Patch result completion UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('priolens/open14-v02/index.html')
          h=p.read_text()

          def repl(old,new,label):
              global h
              if old not in h:
                  raise SystemExit(f'missing anchor: {label}')
              h=h.replace(old,new,1)

          repl('.result h1{font-size:42px}', '.result h1{font-size:42px}.summaryCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 16px;margin:18px 0 24px}.summaryCard h2{font-size:22px;margin:0 0 10px}.summaryText{font-size:18px;line-height:1.48;margin:0}.summaryNext{font-size:15px;line-height:1.55;color:#555;margin:12px 0 0}.resultActions{align-items:stretch}.actionLink{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}', 'summary css')

          repl('<p id="saveStatus" class="note">Sesijos išsaugojimas tikrinamas…</p>', '<p id="saveStatus" class="note">Sesijos išsaugojimas tikrinamas…</p>\n    <div class="summaryCard"><h2>Trumpai</h2><p id="summaryText" class="summaryText"></p><p id="summaryNext" class="summaryNext"></p></div>', 'summary html')

          repl('<div class="actions"><button id="export" class="secondary">Eksportuoti JSON</button><button id="restart" class="primary">Nauja sesija</button></div>\n    <p id="exportStatus" class="note"></p>', '<div class="actions resultActions"><button id="restart" class="primary">Atlikti dar kartą</button><a id="back2rasi" class="secondary actionLink" href="https://2rasi.lt/#experiments">Grįžti į 2rasi</a><button id="export" class="secondary hidden">Eksportuoti JSON</button></div>\n    <p id="exportStatus" class="note hidden"></p>', 'result actions')

          repl("if(DEBUG_MODE)$('debugDetails').classList.remove('hidden');", "const FROM_2RASI=new URLSearchParams(location.search).get('from');\n$('back2rasi').href=FROM_2RASI==='com'?'https://2rasi.com/#experiments':'https://2rasi.lt/#experiments';\nif(DEBUG_MODE){$('debugDetails').classList.remove('hidden');$('export').classList.remove('hidden');$('exportStatus').classList.remove('hidden')}", 'debug and return link')

          repl("function domainStats(){return Object.fromEntries(DOMAINS.map(d=>[d.id,mean(d.items.map(([k])=>state.sufficiency[k]).filter(v=>v!==null))]))}", "function domainCoverage(){return Object.fromEntries(DOMAINS.map(d=>{const vals=d.items.map(([k])=>state.sufficiency[k]);const answered=vals.filter(v=>Number.isFinite(v));return[d.id,{answered:answered.length,total:vals.length,complete:answered.length===vals.length,value:answered.length?mean(answered):null}]}))}\nfunction domainStats(){const c=domainCoverage();return Object.fromEntries(DOMAINS.map(d=>[d.id,c[d.id].value]))}", 'domain coverage')

          repl("function finish(){state.completedAt=new Date().toISOString();state.familyStats=familyStats();state.domainStats=domainStats();state.macroStats=macroStats();", "function finish(){state.completedAt=new Date().toISOString();state.familyStats=familyStats();state.domainCoverage=domainCoverage();state.domainStats=Object.fromEntries(DOMAINS.map(d=>[d.id,state.domainCoverage[d.id].value]));state.macroStats=macroStats();", 'finish coverage')

          pattern=r"function renderResult\(\)\{.*?\}\n\$\('start'\)\.onclick"
          if not re.search(pattern,h,re.S):
              raise SystemExit('missing renderResult block')
          new_render=r'''function joinLt(xs){if(!xs.length)return'';if(xs.length===1)return xs[0];return `${xs.slice(0,-1).join(', ')} ir ${xs.at(-1)}`}
          function renderResult(){
            const coverage=state.domainCoverage||domainCoverage();
            const rep=$('repeatRows');rep.innerHTML='';
            const repeated=Object.entries(state.familyStats).filter(([,x])=>x.chosen>=2&&x.crossExemplar).sort((a,b)=>b[1].chosen-a[1].chosen);
            if(!repeated.length)addRow(rep,'Nė viena tema nepasikartojo per abu savo vaizdus','', 'Šioje sesijoje pasirinkimai buvo labiau išsisklaidę arba susitelkė ties pavieniais vaizdais.',null);
            else repeated.forEach(([id,x])=>addRow(rep,FAMILY_LABEL[id],`${x.chosen}/3`,x.chosen===3?'Kartojosi kiekvieną kartą, kai ši tema pasirodė.':'Kartojosi per du skirtingus šios temos vaizdus.',x.rate*100));

            const sr=$('suffRows');sr.innerHTML='';
            for(const d of DOMAINS){
              const c=coverage[d.id],v=c.value;
              if(c.answered===0)addRow(sr,d.title,'Sunku pasakyti','0/2 atsakyta',null);
              else if(!c.complete)addRow(sr,d.title,`${c.answered}/${c.total} atsakyta`,'Dalinė informacija. Vieno atsakymo nepakanka pilnam šios srities įvertinimui.',null);
              else addRow(sr,d.title,v.toFixed(1),'2/2 atsakyta · 1 = visai nepakanka · 5 = visiškai pakanka',(v/5)*100);
            }

            const cr=$('compareRows');cr.innerHTML='';
            const comps=[];
            for(const d of DOMAINS){
              if(!d.families.length||!coverage[d.id].complete)continue;
              const rel=d.families.filter(f=>state.familyStats[f]?.chosen>=2&&state.familyStats[f]?.crossExemplar);
              if(!rel.length)continue;
              const v=state.domainStats[d.id];
              const famNames=rel.map(f=>FAMILY_LABEL[f]).join(', ');
              let cue;
              if(v<=2.5)cue=`${famNames} kartojosi per skirtingus vaizdus, o šią platesnę sritį pats vertini kaip mažiau pakankamą.`;
              else if(v>=3.5)cue=`${famNames} kartojosi per skirtingus vaizdus ir kartu ši platesnė sritis atrodo gana pakankama.`;
              else cue=`${famNames} kartojosi, o tavo dabartinis šios platesnės srities įvertinimas yra per vidurį.`;
              comps.push({name:d.title,cue});
            }
            if(!comps.length)addRow(cr,'Ryškaus sugretinimo šioje sesijoje nėra','', 'Tai nėra problema: abi perspektyvos neprivalo sudaryti tvarkingo vieno profilio.',null);
            else comps.slice(0,3).forEach(c=>addRow(cr,c.name,'',c.cue,null));

            const names=repeated.slice(0,3).map(([id])=>FAMILY_LABEL[id]);
            let first;
            if(!repeated.length)first='Šioje sesijoje neatsirado tema, kuri pasikartotų per abu savo vaizdus. Pasirinkimai buvo labiau išsisklaidę.';
            else first=`Per skirtingus vaizdus šioje sesijoje kartojosi ${joinLt(names)}${repeated.length>3?' ir dar kelios temos':''}.`;
            let second;
            if(comps.length)second=`Su tavo dabartiniu įsivertinimu verta sugretinti ${joinLt(comps.slice(0,2).map(c=>c.name.toLowerCase()))}. Žemiau matai, kur šios dvi perspektyvos susitinka.`;
            else second='Su dabartinio pakankamumo vertinimu aiškaus sugretinimo nėra. Ir tai yra normalus šios sesijos rezultatas.';
            $('summaryText').textContent=`${first} ${second}`;
            $('summaryNext').textContent='Tai nėra išvada apie tai, ko tau trūksta. Žiūrėk į rezultatą kaip į klausimą: ar kuri nors iš šių vietų atpažįstama tavo dabartinėje situacijoje? Jei smalsu, kitą kartą gali atlikti sesiją dar kartą ir pažiūrėti, kas išlieka.';
            $('debug').textContent=JSON.stringify(state,null,2);
          }
          $('start').onclick'''
          h=re.sub(pattern,new_render,h,count=1,flags=re.S)

          p.write_text(h)
          print('PATCH_OK')
          PY

      - name: Validate runtime patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="summaryText"' priolens/open14-v02/index.html
          grep -q 'Atlikti dar kartą' priolens/open14-v02/index.html
          grep -q 'Grįžti į 2rasi' priolens/open14-v02/index.html
          grep -q 'Dalinė informacija' priolens/open14-v02/index.html
          grep -q "coverage\[d.id\].complete" priolens/open14-v02/index.html
          grep -q "FROM_2RASI==='com'" priolens/open14-v02/index.html

      - name: Commit runtime patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v02/index.html
          git commit -m 'feat(priolens): complete participant result flow'
          git push

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Publish patched runtime
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; put -O \"$REMOTE_DIR/\" priolens/open14-v02/index.html"

      - name: Live smoke
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsS --retry 4 --retry-delay 1 https://omesg360.eu/priolens-open14-v02/)
          grep -q 'Trumpai' <<<"$body"
          grep -q 'Atlikti dar kartą' <<<"$body"
          grep -q 'Grįžti į 2rasi' <<<"$body"
          grep -q 'Dalinė informacija' <<<"$body"
