name: Mark PrioLens Open14 v0.3.1 asset gate pass

on:
  push:
    branches:
      - feature/priolens-open14-v03
    paths:
      - '.github/workflows/priolens-open14-v03-mark-asset-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mark-asset-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-open14-v03

      - name: Update v0.3.1 bank gate metadata without enabling runtime
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path
          p=Path('priolens/open14-v03/bank.json')
          bank=json.loads(p.read_text())
          if bank.get('schema')!='2rasi.priolens.open14.bank-v0.3.1':
              raise SystemExit('Unexpected bank schema')
          if bank.get('runtimeReady') is not False:
              raise SystemExit('Refusing: runtimeReady must remain false before API and preview gates')
          bank['status']='V031_FULL42_ASSET_GATE_PASS_API_PENDING_FAIL_CLOSED'
          gate=bank.setdefault('deploymentGate',{})
          gate['ownerRemediationAssetsUploaded']=True
          gate['ownerRemediationAssetsReachabilityPassed']=True
          gate['ownerRemediationAssetsHashPassed']=True
          gate['ownerRemediationAssetRunId']=33785859324
          gate['full42AuditPassed']=True
          gate['full42AuditRunId']=33790603165
          gate['apiDeployed']=False
          gate['apiSmokePassed']=False
          gate['participantPreviewDeployed']=False
          gate['participantPreviewStaticSmokePassed']=False
          gate['participantPreviewChromiumSmokePassed']=False
          gate['ownerMobileVisualSmokePassed']=False
          bank['startPolicy']='FAIL_CLOSED_UNTIL_V031_API_AND_PREVIEW_GATES_PASS'
          p.write_text(json.dumps(bank,indent=2,ensure_ascii=False)+'\n')
          PY
          grep -q '"schema": "2rasi.priolens.open14.bank-v0.3.1"' priolens/open14-v03/bank.json
          grep -q '"runtimeReady": false' priolens/open14-v03/bank.json
          grep -q '"full42AuditPassed": true' priolens/open14-v03/bank.json
          grep -q '"full42AuditRunId": 33790603165' priolens/open14-v03/bank.json

      - name: Commit v0.3.1 gate metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v03/bank.json
          if git diff --cached --quiet; then
            echo 'No bank metadata change needed.'
            exit 0
          fi
          git commit -m 'PrioLens v0.3.1: mark full42 asset gate pass'
          git push origin HEAD:feature/priolens-open14-v03
