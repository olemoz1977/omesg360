name: Patch PrioLens autosave resume and slider

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-priolens-autosave-slider.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  RUNTIME_DIR: /domains/omesg360.eu/public_html/priolens-open14-v02
  API_DIR: /domains/omesg360.eu/public_html/priolens-open14-api

jobs:
  patch-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply source patch
        run: python priolens/open14-v02/tools/patch_autosave_slider.py

      - name: Validate patched source
        shell: bash
        run: |
          set -euo pipefail
          php -l priolens/open14-v02/server/api.php
          php -l priolens/open14-v02/server/progress.php
          python - <<'PY'
          from pathlib import Path
          h=Path('priolens/open14-v02/index.html').read_text()
          assert '/priolens-open14-api/progress.php' in h
          assert 'DRAFT_KEY' in h
          assert 'resumeSession' in h
          assert 'type="range"' in h
          assert 'Labai trūksta' in h
          script=h.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/open14-app.mjs').write_text(script)
          PY
          node --check /tmp/open14-app.mjs
          node priolens/open14-v02/tools/make_autosave_smoke_payload.mjs

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v02/index.html priolens/open14-v02/server/api.php priolens/open14-v02/server/progress.php .github/workflows/deploy-priolens-open14-api.yml .github/workflows/deploy-priolens-open14-runtime.yml
          git commit -m 'feat(priolens): autosave resume and hidden Likert slider'
          git push origin HEAD:main

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy isolated runtime and API files
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST; put -O \"$RUNTIME_DIR/\" priolens/open14-v02/index.html; put -O \"$API_DIR/\" priolens/open14-v02/server/api.php; put -O \"$API_DIR/\" priolens/open14-v02/server/progress.php"

      - name: Smoke partial to final lifecycle
        shell: bash
        run: |
          set -euo pipefail
          base='https://omesg360.eu/priolens-open14-api'
          node priolens/open14-v02/tools/make_autosave_smoke_payload.mjs
          curl -fsS -H 'Content-Type: application/json' --data-binary @/tmp/priolens-partial.json "$base/progress.php" | tee /tmp/partial-response
          grep -q '"ok":true' /tmp/partial-response
          curl -fsS -H 'Content-Type: application/json' --data-binary @/tmp/priolens-final.json "$base/api.php" | tee /tmp/final-response
          grep -q '"ok":true' /tmp/final-response
          curl -fsS -H 'Content-Type: application/json' --data-binary @/tmp/priolens-partial.json "$base/progress.php" | tee /tmp/after-response
          grep -q '"completedAlready":true' /tmp/after-response

      - name: Smoke live runtime markers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 'https://omesg360.eu/priolens-open14-v02/' -o /tmp/live
          grep -q '/priolens-open14-api/progress.php' /tmp/live
          grep -q 'Labai trūksta' /tmp/live
          grep -q 'Tęsti sesiją' /tmp/live
          echo 'PASS: autosave resume and slider are live'
