name: Find PrioLens clean Gallery duplicates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/find-priolens-clean-gallery-duplicates.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_GALLERY: /domains/omesg360.eu/public_html/priolens-research-assets/Gallery

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp tesseract-ocr
          python -m pip install --quiet pillow ImageHash
      - name: Mirror Gallery and rank perceptual near-duplicates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gallery
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; mirror --parallel=4 --only-newer \"$REMOTE_GALLERY\" /tmp/gallery"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import imagehash, subprocess
          root=Path('/tmp/gallery')
          targets={
            'CONNECTION-A':'S03.webp',
            'CONNECTION-B':'20260829_235204397.png',
            'SAFETY-B':'20260829_233727670.png',
          }
          imgs=[]
          for p in root.iterdir():
              if not p.is_file(): continue
              try:
                  with Image.open(p) as im:
                      h=imagehash.phash(im.convert('RGB'))
                      imgs.append((p,h,im.size))
              except Exception:
                  pass
          print(f'GALLERY_IMAGES={len(imgs)}')
          for label,fn in targets.items():
              tp=root/fn
              if not tp.exists():
                  print(label,'TARGET_MISSING',fn); continue
              with Image.open(tp) as im: th=imagehash.phash(im.convert('RGB'))
              ranked=sorted(((th-h,p,size) for p,h,size in imgs if p.name!=fn), key=lambda x:x[0])[:12]
              print(f'=== {label} target={fn} ===')
              for dist,p,size in ranked:
                  # OCR sparse text only for close-ish candidates; gibberish is acceptable diagnostic.
                  text=''
                  if dist <= 18:
                      try:
                          q=subprocess.run(['tesseract',str(p),'stdout','--psm','11'],capture_output=True,text=True,timeout=20)
                          text=' '.join(q.stdout.split())[:160]
                      except Exception: pass
                  print(f'd={dist:02d}\t{p.name}\t{size[0]}x{size[1]}\tOCR={text or "<none>"}')
          PY
