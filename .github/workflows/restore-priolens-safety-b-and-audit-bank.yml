name: Restore SAFETY-B and audit Open14 bank assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-priolens-safety-b-and-audit-bank.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  ROOT: /domains/omesg360.eu/public_html/priolens-research-assets

jobs:
  restore-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Restore exact mirrored SAFETY-B
        shell: bash
        run: |
          set -euo pipefail
          src='priolens/gallery-review/open14-v01/20260829_233727670.png'
          test -s "$src"
          file "$src" | grep -Eq 'PNG image data'
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST; put -O \"$ROOT/Gallery/\" \"$src\""
          echo 'PASS: exact repo-mirrored SAFETY-B restored'
      - name: Audit all 28 bank assets against FTP listings
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST; cls -1 \"$ROOT/Gallery/\"" > /tmp/gallery.txt
          lftp -c "set ftp:ssl-allow no; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST; cls -1 \"$ROOT/Open14-v02/\"" > /tmp/open14.txt
          lftp -c "set ftp:ssl-allow no; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST; cls -1 \"$ROOT/Recovered/\"" > /tmp/recovered.txt
          python - <<'PY'
          import json, pathlib
          b=json.load(open('priolens/open14-v02/bank.json'))
          listings={
            'Gallery': set(pathlib.Path('/tmp/gallery.txt').read_text().splitlines()),
            'Open14-v02': set(pathlib.Path('/tmp/open14.txt').read_text().splitlines()),
            'Recovered': set(pathlib.Path('/tmp/recovered.txt').read_text().splitlines()),
          }
          missing=[]
          checked=0
          for fid,fam in b['families'].items():
              for ex in fam['exemplars']:
                  p=ex['runtimePath']
                  rel=p.split('/priolens-research-assets/',1)[1]
                  folder,name=rel.split('/',1)
                  checked+=1
                  if name not in listings[folder]:
                      missing.append((fid,ex['id'],p))
          print('CHECKED',checked)
          for row in missing: print('MISSING',*row)
          assert checked==28
          assert not missing, missing
          print('PASS: all 28 bank assets physically present on FTP')
          PY
      - name: HTTP smoke restored SAFETY-B with browser referer
        shell: bash
        run: |
          set -euo pipefail
          u='https://omesg360.eu/priolens-research-assets/Gallery/20260829_233727670.png'
          code=$(curl -sS -A 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' -e 'https://omesg360.eu/priolens-open14-v02/' -o /dev/null -w '%{http_code}' --retry 4 --retry-delay 2 "$u")
          echo "SAFETY-B HTTP=$code"
          test "$code" = '200'
