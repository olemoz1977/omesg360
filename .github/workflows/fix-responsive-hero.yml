name: One-time responsive hero repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-responsive-hero.yml
      - index.html

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch responsive hero safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            (
              '.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:70px;align-items:center}',
              '.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:70px;align-items:center}.hero-grid>*{min-width:0}'
            ),
            (
              'letter-spacing:-.065em;font-weight:800}h1 .accent{display:block;',
              'letter-spacing:-.065em;font-weight:800}h1>span{display:block}h1 .accent{display:block;'
            ),
            (
              'h1{font-size:clamp(2.7rem,15vw,4.5rem)}',
              'h1{font-size:clamp(2.35rem,12.5vw,3.4rem);letter-spacing:-.055em}'
            ),
          ]
          changed = 0
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed += 1
              elif new in s:
                  pass
              else:
                  raise SystemExit(f'Expected CSS anchor not found: {old[:80]}')
          p.write_text(s, encoding='utf-8')
          print(f'Responsive hero patch anchors applied/already present: {changed}/3 changed')
          PY
          bash scripts/validate-v02.sh
          grep -Fq '.hero-grid>*{min-width:0}' index.html
          grep -Fq 'h1>span{display:block}' index.html
          grep -Fq 'clamp(2.35rem,12.5vw,3.4rem)' index.html
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No responsive changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix hero layout on desktop and mobile'
          git push origin HEAD:main
