name: Patch PrioLens Open14 runtime for pilot storage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-priolens-open14-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime deterministically
        shell: python
        run: |
          from pathlib import Path
          p = Path('priolens/open14-v02/index.html')
          s = p.read_text(encoding='utf-8')

          reps = [
            (
              '<p class="note">14 trumpų pasirinkimų. Po jų bus kita, atskira perspektyva apie tai, kiek skirtingų dalykų šiuo metu tavo gyvenime pakanka.</p>',
              '<p class="note">14 trumpų pasirinkimų. Po jų bus kita, atskira perspektyva apie tai, kiek skirtingų dalykų šiuo metu tavo gyvenime pakanka.</p>\\n    <p class="note">Formative pilotui sesijos duomenys išsaugomi atskirai iki 90 dienų. Rezultatas nėra asmenybės profilis ar diagnozė.</p>'
            ),
            (
              '<p class="note">Tai šios sesijos pasirinkimų ir tavo dabartinio įsivertinimo aprašymas, ne asmenybės profilis ar diagnozė.</p>',
              '<p class="note">Tai šios sesijos pasirinkimų ir tavo dabartinio įsivertinimo aprašymas, ne asmenybės profilis ar diagnozė.</p>\\n    <p id="saveStatus" class="note">Sesijos išsaugojimas tikrinamas…</p>'
            ),
            (
              "import { assignOpen14Exemplars, listMissingRuntimeAssets } from './p3_open14_exemplar_assigner_v01.mjs';",
              "import { assignOpen14Exemplars, listMissingRuntimeAssets } from './p3_open14_exemplar_assigner_v01.mjs';\\nconst API_PATH='/priolens-open14-api/api.php';"
            ),
            (
              "state={schema:'2rasi.priolens.open14.session-v0.2',startedAt:new Date().toISOString(),seed,planSchema:plan.schema,bankSchema:bank.schema,assignerSchema:assignment.schema,plannerAudit:plan.audit,exemplarAudit:assignment.audit,exemplarPlan:assignment.exemplarPlan,choices:[],sufficiencySchema:'2rasi.priolens.sufficiency-v0.2',sufficiency:{},completedAt:null}",
              "state={schema:'2rasi.priolens.open14.session-v0.2',sessionUuid:crypto.randomUUID(),startedAt:new Date().toISOString(),seed,planSchema:plan.schema,bankSchema:bank.schema,assignerSchema:assignment.schema,plannerAudit:plan.audit,exemplarAudit:assignment.audit,exemplarPlan:assignment.exemplarPlan,choices:[],sufficiencySchema:'2rasi.priolens.sufficiency-v0.2',sufficiency:{},completedAt:null}"
            ),
            (
              "function finish(){state.completedAt=new Date().toISOString();state.familyStats=familyStats();state.domainStats=domainStats();state.macroStats=macroStats();state.rtMedianMs=median(state.choices.map(x=>x.rtMs));state.noClearChoiceCount=state.choices.filter(x=>x.noClearChoice).length;show('result');renderResult()}",
              "async function submitSession(){const el=$('saveStatus');try{el.textContent='Išsaugoma anoniminė tyrimo sesija…';const r=await fetch(API_PATH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.message||`HTTP ${r.status}`);state.submission={ok:true,inserted:Boolean(data.inserted),submissionId:data.submissionId||null};el.textContent='Anoniminė tyrimo sesija išsaugota.';el.className='note ok';$('debug').textContent=JSON.stringify(state,null,2)}catch(err){state.submission={ok:false,error:String(err)};el.textContent='Automatinis išsaugojimas nepavyko. Rezultatas išlieka, JSON gali eksportuoti rankiniu būdu.';el.className='note bad';$('debug').textContent=JSON.stringify(state,null,2);console.error(err)}}\\nfunction finish(){state.completedAt=new Date().toISOString();state.familyStats=familyStats();state.domainStats=domainStats();state.macroStats=macroStats();state.rtMedianMs=median(state.choices.map(x=>x.rtMs));state.noClearChoiceCount=state.choices.filter(x=>x.noClearChoice).length;show('result');renderResult();submitSession()}"
            ),
          ]

          for old, new in reps:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, got {count}: {old[:80]}')
            s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          print('PASS: runtime patched')
      - name: Sanity checks
        run: |
          set -euo pipefail
          grep -q "sessionUuid:crypto.randomUUID" priolens/open14-v02/index.html
          grep -q "priolens-open14-api/api.php" priolens/open14-v02/index.html
          grep -q "submitSession" priolens/open14-v02/index.html
          grep -q "90 dienų" priolens/open14-v02/index.html
      - name: Commit patched runtime
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v02/index.html
          git commit -m 'Connect Open14 runtime to pilot API'
          git push origin main
