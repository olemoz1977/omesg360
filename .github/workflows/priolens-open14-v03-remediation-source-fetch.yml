name: Fetch PrioLens v0.3 remediation stock sources

on:
  push:
    branches: [feature/priolens-open14-v03]
    paths:
      - '.github/workflows/priolens-open14-v03-remediation-source-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Fetch candidate sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src out
          get(){ id="$1"; url="$2"; echo "$id <- $url"; curl -fsSL --retry 3 "$url" -o "src/$id.jpg"; }
          get rest_7937987 'https://images.pexels.com/photos/7937987/pexels-photo-7937987.jpeg'
          get rest_7938006 'https://images.pexels.com/photos/7938006/pexels-photo-7938006.jpeg'
          get recognition_8520508 'https://images.pexels.com/photos/8520508/pexels-photo-8520508.jpeg'
          get knowledge_9040616 'https://images.pexels.com/photos/9040616/pexels-photo-9040616.jpeg'
          get knowledge_4443182 'https://images.pexels.com/photos/4443182/pexels-photo-4443182.jpeg'
          get knowledge_5905716 'https://images.pexels.com/photos/5905716/pexels-photo-5905716.jpeg'
      - name: Build source overview
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw,ImageFont
          from pathlib import Path
          root=Path('src'); font=ImageFont.load_default()
          names=sorted(root.glob('*.jpg'))
          tiles=[]
          for p in names:
              im=Image.open(p).convert('RGB')
              w,h=im.size
              thumb=ImageOps.contain(im,(360,360))
              c=Image.new('RGB',(380,410),'white')
              c.paste(thumb,((380-thumb.width)//2,(360-thumb.height)//2))
              ImageDraw.Draw(c).text((10,370),f'{p.stem}  {w}x{h}',fill='black',font=font)
              tiles.append(c)
          cols=2; rows=(len(tiles)+1)//2
          sheet=Image.new('RGB',(cols*380,rows*410),(230,230,230))
          for i,t in enumerate(tiles): sheet.paste(t,((i%2)*380,(i//2)*410))
          sheet.save('out/source_overview.jpg',quality=92)
          for p in names:
              im=Image.open(p).convert('RGB')
              ImageOps.fit(im,(640,640),method=Image.Resampling.LANCZOS,centering=(0.5,0.5)).save(f'out/{p.stem}_center_640.webp','WEBP',quality=92)
          PY
      - name: Upload candidate sources
        uses: actions/upload-artifact@v4
        with:
          name: priolens-v03-remediation-source-fetch
          path: |
            src/
            out/
          retention-days: 14
