name: Mark PrioLens Open14 v0.3.1 API gate pass

on:
  push:
    branches:
      - feature/priolens-open14-v03
    paths:
      - '.github/workflows/priolens-open14-v03-mark-api-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mark-api-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-open14-v03

      - name: Guard v0.3.1 gates and mark source bank ready for separate preview build/deploy
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path
          p=Path('priolens/open14-v03/bank.json')
          bank=json.loads(p.read_text())
          assert bank['schema']=='2rasi.priolens.open14.bank-v0.3.1'
          assert bank['status']=='V031_FULL42_ASSET_GATE_PASS_API_PENDING_FAIL_CLOSED'
          assert bank['runtimeReady'] is False
          gate=bank['deploymentGate']
          assert gate['ownerRemediationAssetsUploaded'] is True
          assert gate['ownerRemediationAssetsReachabilityPassed'] is True
          assert gate['ownerRemediationAssetsHashPassed'] is True
          assert gate['full42AuditPassed'] is True
          assert gate['full42AuditRunId']==33790603165
          bank['status']='V031_API_GATE_PASS_READY_FOR_PREVIEW_BUILD_DEPLOY'
          bank['runtimeReady']=True
          bank['startPolicy']='READY_FOR_SEPARATE_V031_PARTICIPANT_PREVIEW_BUILD_DEPLOY'
          gate['apiDeployed']=True
          gate['apiDeployRunId']=33791065786
          gate['apiSmokePassed']=True
          gate['apiSmokeRunId']=33791193830
          gate['participantPreviewDeployed']=False
          gate['participantPreviewStaticSmokePassed']=False
          gate['participantPreviewChromiumSmokePassed']=False
          gate['ownerMobileVisualSmokePassed']=False
          p.write_text(json.dumps(bank,indent=2,ensure_ascii=False)+'\n')
          PY

          grep -q '"schema": "2rasi.priolens.open14.bank-v0.3.1"' priolens/open14-v03/bank.json
          grep -q '"runtimeReady": true' priolens/open14-v03/bank.json
          grep -q '"apiSmokeRunId": 33791193830' priolens/open14-v03/bank.json

      - name: Commit v0.3.1 API gate metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v03/bank.json
          if git diff --cached --quiet; then
            echo 'No bank change needed.'
            exit 0
          fi
          git commit -m 'PrioLens v0.3.1: mark API gate pass and build ready'
          git push origin HEAD:feature/priolens-open14-v03
