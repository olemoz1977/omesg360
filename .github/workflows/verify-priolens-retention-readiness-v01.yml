name: Verify PrioLens retention readiness v01

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-priolens-retention-readiness-v01.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-open14-api

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate cleanup source
        shell: bash
        run: |
          set -euo pipefail
          php -l priolens/open14-v02/server/cleanup.php
          grep -q "PHP_SAPI !== 'cli'" priolens/open14-v02/server/cleanup.php
          grep -q 'DELETE FROM priolens_open14_sessions WHERE expires_at < NOW()' priolens/open14-v02/server/cleanup.php
          echo 'PASS: cleanup source is CLI-only and expiry-scoped'

      - name: Verify FTP secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FTP_USER:-}" ]] || { echo 'Missing HOSTINGER_FTP_USER' >&2; exit 1; }
          [[ -n "${FTP_PASSWORD:-}" ]] || { echo 'Missing HOSTINGER_FTP_PASSWORD' >&2; exit 1; }

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verify deployed cleanup file parity
        shell: bash
        run: |
          set -euo pipefail
          common='set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; set cmd:fail-exit yes;'
          lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; get \"$REMOTE_DIR/cleanup.php\" -o /tmp/cleanup-remote.php"
          cmp priolens/open14-v02/server/cleanup.php /tmp/cleanup-remote.php
          sha256sum priolens/open14-v02/server/cleanup.php /tmp/cleanup-remote.php
          echo 'PASS: production cleanup.php exactly matches repository source'

      - name: Verify cleanup cannot run over HTTP
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 4 --retry-delay 2 -o /tmp/cleanup-http-body -w '%{http_code}' 'https://omesg360.eu/priolens-open14-api/cleanup.php')"
          [[ "$code" == '403' || "$code" == '404' ]] || { echo "Expected cleanup HTTP denial 403/404, got $code" >&2; cat /tmp/cleanup-http-body >&2; exit 1; }
          echo "PASS: cleanup endpoint is not web-executable (HTTP $code)"

      - name: Verify live DB expiry invariant read-only
        shell: bash
        run: |
          set -euo pipefail
          rnd="retentiondiag-$(python - <<'PY'
          import secrets
          print(secrets.token_hex(16))
          PY
          ).php"
          cleanup_tmp(){
            lftp -c "set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; rm -f \"$REMOTE_DIR/$rnd\"" >/dev/null 2>&1 || true
          }
          trap cleanup_tmp EXIT

          cat > /tmp/retentiondiag.php <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          require_once __DIR__.'/config.php';
          $pdo = new PDO(
              'mysql:host='.DB_HOST.';dbname='.DB_NAME.';charset=utf8mb4',
              DB_USER,
              DB_PASS,
              [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION, PDO::ATTR_EMULATE_PREPARES=>false]
          );
          $one = fn($sql) => $pdo->query($sql)->fetchColumn();
          $col = $pdo->query("SELECT EXTRA, GENERATION_EXPRESSION FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='priolens_open14_sessions' AND COLUMN_NAME='expires_at'")->fetch(PDO::FETCH_ASSOC);
          $idx = (int)$one("SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='priolens_open14_sessions' AND INDEX_NAME='idx_expires_at' AND COLUMN_NAME='expires_at'");
          $out = [
            'expiresColumnPresent' => is_array($col),
            'expiresExtra' => $col['EXTRA'] ?? null,
            'expiresExpression' => $col['GENERATION_EXPRESSION'] ?? null,
            'expiresIndexPresent' => $idx > 0,
            'totalRows' => (int)$one("SELECT COUNT(*) FROM priolens_open14_sessions"),
            'expiredRowsNow' => (int)$one("SELECT COUNT(*) FROM priolens_open14_sessions WHERE expires_at < NOW()"),
            'expiryMismatchRows' => (int)$one("SELECT COUNT(*) FROM priolens_open14_sessions WHERE expires_at <> created_at + INTERVAL 90 DAY")
          ];
          echo json_encode($out, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          PHP

          cp /tmp/retentiondiag.php "/tmp/$rnd"
          common='set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; set cmd:fail-exit yes;'
          lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; put -O \"$REMOTE_DIR/\" \"/tmp/$rnd\""
          sleep 1
          curl -fsS --retry 4 --retry-delay 1 "https://omesg360.eu/priolens-open14-api/$rnd" -o /tmp/retention.json
          cat /tmp/retention.json
          echo
          python - <<'PY'
          import json
          d=json.load(open('/tmp/retention.json'))
          assert d.get('expiresColumnPresent') is True, d
          assert d.get('expiresIndexPresent') is True, d
          assert d.get('expiryMismatchRows') == 0, d
          expr=(d.get('expiresExpression') or '').replace('`','').lower().replace(' ','')
          assert 'created_at' in expr and ('90' in expr), d
          print('PASS: live DB expiry column/index/invariant verified read-only')
          print('expiredRowsNow=', d.get('expiredRowsNow'))
          PY

      - name: Readiness conclusion
        run: |
          echo 'RETENTION_CODE_AND_DB_READY=YES'
          echo 'HOSTINGER_CRON_CONFIGURED=NOT_VERIFIED_BY_THIS_WORKFLOW'
          echo 'NEXT: create PHP cron in hPanel for production cleanup.php and verify View Output after first run.'
