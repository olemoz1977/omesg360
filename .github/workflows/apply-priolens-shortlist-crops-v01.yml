name: Apply PrioLens shortlist crops v01

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-priolens-shortlist-crops-v01.yml'

permissions:
  contents: write

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  RUNTIME_DIR: /domains/omesg360.eu/public_html/priolens-open14-v02

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch owner-selected crops
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('priolens/open14-v02/bank.json')
          bank=json.loads(p.read_text(encoding='utf-8'))

          rest=bank['families']['REST']['exemplars'][1]
          rest['previousRuntimePath']=rest['runtimePath']
          rest['sourceRuntimePath']=rest.get('selectedCandidateSourceRuntimePath','/priolens-research-assets/Gallery/20260730_232752414.png')
          rest['runtimePath']='/priolens-research-assets/Open14-remediation-v02/rest-b_owner-b_sq_center_v01.webp'
          rest['geometryStatus']='HUMAN_ACCEPTED_CENTER_CROP_1TO1'
          rest['status']='OWNER_ACCEPTED_REPLACEMENT_SWITCHED'
          rest['firstImpulse']='pailsėti / atsistatyti'
          rest['risk']='owner selected shortlist B and center crop after direct visual review; OCR watermark keyword screen passed'
          rest.pop('visualStatus',None)
          rest.pop('selectedCandidateSourceRuntimePath',None)

          kb=bank['families']['KNOWLEDGE']['exemplars'][1]
          kb['previousRuntimePath']=kb['runtimePath']
          kb['sourceRuntimePath']=kb.get('selectedCandidateSourceRuntimePath','/priolens-research-assets/Gallery/20260730_022124068.png')
          kb['runtimePath']='/priolens-research-assets/Open14-remediation-v02/knowledge-b_owner-b_sq_bottom_v01.webp'
          kb['geometryStatus']='HUMAN_ACCEPTED_BOTTOM_CROP_1TO1'
          kb['status']='OWNER_ACCEPTED_REPLACEMENT_SWITCHED'
          kb['firstImpulse']='mokytis / suprasti per skaitmeninę terpę'
          kb['risk']='owner selected shortlist B and bottom crop after direct visual review; OCR watermark keyword screen passed'
          kb.pop('semanticStatus',None)
          kb.pop('selectedCandidateSourceRuntimePath',None)

          p.write_text(json.dumps(bank,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          git config user.name 'olemoz1977'
          git config user.email 'olemoz1977@gmail.com'
          git add priolens/open14-v02/bank.json
          git commit -m 'fix(priolens): switch accepted Rest-B and Knowledge-B crops'
          git push

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy bank and smoke with GET
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; put priolens/open14-v02/bank.json -o \"$RUNTIME_DIR/bank.json\""
          for u in \
            https://omesg360.eu/priolens-research-assets/Open14-remediation-v02/rest-b_owner-b_sq_center_v01.webp \
            https://omesg360.eu/priolens-research-assets/Open14-remediation-v02/knowledge-b_owner-b_sq_bottom_v01.webp; do
            curl -fsS --retry 5 --retry-delay 2 "$u" -o /dev/null
          done
          curl -fsS --retry 5 --retry-delay 2 https://omesg360.eu/priolens-open14-v02/bank.json > /tmp/live-bank.json
          grep -q 'rest-b_owner-b_sq_center_v01.webp' /tmp/live-bank.json
          grep -q 'knowledge-b_owner-b_sq_bottom_v01.webp' /tmp/live-bank.json
          grep -q 'SEARCH_REQUIRED_AFTER_SHORTLIST_REJECT' /tmp/live-bank.json
