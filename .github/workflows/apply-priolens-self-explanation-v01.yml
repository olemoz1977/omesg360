name: Apply PrioLens self explanation v01

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-priolens-self-explanation-v01.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply self-explanation patch
        run: python scripts/apply-priolens-self-explanation-v01.py

      - name: Validate inline module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('priolens/open14-v02/index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/priolens-runtime.mjs').write_text(s[a:b])
          for needle in [
            'SELF_REASON_OPTIONS',
            '2rasi.priolens.self-explanation-v0.1',
            'Kaip tau atrodo, kodėl būtent šie vaizdai tave traukė?',
            'Norėčiau daugiau to savo gyvenime',
            'Man tai dabar svarbu',
            'Primena žmogų ar situaciją',
            'Tiesiog patraukė pats vaizdas',
            'persistSelfExplanation',
            'reasonOptions'
          ]:
            assert needle in s, needle
          PY
          node --check /tmp/priolens-runtime.mjs

      - name: Commit runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v02/index.html
          git commit -m 'feat(priolens): add participant self explanation'
          git push origin HEAD:main
