name: Cleanup obsolete PrioLens/Open14 workflows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-priolens-ci-noise-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align persistent runtime smoke and remove historical workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-priolens-open14-runtime.yml')
          s=p.read_text()
          old="['Open14 stimulus bank','bank.json','Keičiant išlaikyti pirmą impulsą']"
          new="['Open14 stimulus bank','bank.json']"
          if old not in s:
              raise SystemExit('persistent runtime smoke anchor missing')
          p.write_text(s.replace(old,new,1))
          PY

          keep=' deploy-priolens-open14-api.yml deploy-priolens-open14-runtime.yml deploy-priolens-hostinger.yml cleanup-priolens-ci-noise-once.yml '
          shopt -s nullglob
          for f in .github/workflows/*priolens*.yml .github/workflows/*open14*.yml; do
            b="$(basename "$f")"
            case "$keep" in
              *" $b "*) continue ;;
            esac
            git rm -f -- "$f"
          done

          git add .github/workflows/deploy-priolens-open14-runtime.yml
          git rm -f .github/workflows/cleanup-priolens-ci-noise-once.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(priolens): keep only persistent runtime and API deploy workflows'
          git push origin HEAD:main
