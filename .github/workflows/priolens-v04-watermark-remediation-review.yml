name: Build PrioLens v0.4 watermark remediation review

on:
  push:
    branches: [fix/priolens-v04-watermark-remediation]
    paths:
      - '.github/workflows/priolens-v04-watermark-remediation-review.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-research-assets/Open14-v04-watermark-remediation-review-v01
  PUBLIC_BASE: https://omesg360.eu/priolens-research-assets/Open14-v04-watermark-remediation-review-v01
  CURRENT_BASE: https://omesg360.eu/priolens-research-assets

jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          python -m pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Fetch current contaminated/context stimuli and clean stock candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src out

          get(){ name="$1"; url="$2"; echo "$name <- $url"; curl -fsSL --retry 3 --retry-delay 1 "$url" -o "src/$name"; }

          # Current family context / contamination evidence
          get safety_01_current.webp "$CURRENT_BASE/Gallery/S08.webp"
          get safety_02_watermarked.webp "$CURRENT_BASE/Gallery/S13.webp"
          get safety_03_current.webp "$CURRENT_BASE/Open14-v03/safety_03_640.webp"

          get exploration_01_watermarked.webp "$CURRENT_BASE/Gallery/S09.webp"
          get exploration_02_current.webp "$CURRENT_BASE/Open14-final-v01/exploration-b_magnifier-forest_v01.webp"
          get exploration_03_current.webp "$CURRENT_BASE/Open14-v03/exploration_03_640.webp"

          get autonomy_01_current.png "$CURRENT_BASE/Gallery/file_00000000cc8c81f4a927534c8316290c.png"
          get autonomy_02_sparkle.webp "$CURRENT_BASE/Recovered/priolens_aut_backpack_v01.webp"
          get autonomy_03_current.webp "$CURRENT_BASE/Open14-v03/autonomy_03_640.webp"

          # SAFETY challenger sources, all Pexels/free-to-use stock
          get safety_cand_a.jpg "https://images.pexels.com/photos/14526291/pexels-photo-14526291.jpeg"
          get safety_cand_b.jpg "https://images.pexels.com/photos/14526290/pexels-photo-14526290.jpeg"
          get safety_cand_c.jpg "https://images.pexels.com/photos/34955357/pexels-photo-34955357.jpeg"

          # EXPLORATION challenger sources. Deliberately varied; none is promoted automatically.
          get exploration_cand_a.jpg "https://images.pexels.com/photos/10567235/pexels-photo-10567235.jpeg"
          get exploration_cand_b.jpg "https://images.pexels.com/photos/12912014/pexels-photo-12912014.jpeg"
          get exploration_cand_c.jpg "https://images.pexels.com/photos/1812527/pexels-photo-1812527.jpeg"

          sha256sum src/* | sort > out/source_sha256.txt

      - name: Render normalized 640x640 review candidates and contact sheets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw,ImageFont
          from pathlib import Path
          import hashlib,json

          src=Path('src'); out=Path('out')
          R=Image.Resampling.LANCZOS
          font=ImageFont.load_default()

          groups={
            'SAFETY':[
              ('SAFETY-01 current','safety_01_current.webp','current'),
              ('SAFETY-02 WATERMARK','safety_02_watermarked.webp','watermarked'),
              ('SAFETY-03 current','safety_03_current.webp','current'),
              ('SAFETY-CAND-A Pexels 14526291','safety_cand_a.jpg','candidate'),
              ('SAFETY-CAND-B Pexels 14526290','safety_cand_b.jpg','candidate'),
              ('SAFETY-CAND-C Pexels 34955357','safety_cand_c.jpg','candidate'),
            ],
            'EXPLORATION':[
              ('EXPLORATION-01 WATERMARK','exploration_01_watermarked.webp','watermarked'),
              ('EXPLORATION-02 current','exploration_02_current.webp','current'),
              ('EXPLORATION-03 current','exploration_03_current.webp','current'),
              ('EXPLORATION-CAND-A Pexels 10567235','exploration_cand_a.jpg','candidate'),
              ('EXPLORATION-CAND-B Pexels 12912014','exploration_cand_b.jpg','candidate'),
              ('EXPLORATION-CAND-C Pexels 1812527','exploration_cand_c.jpg','candidate'),
            ],
            'AUTONOMY_REVIEW':[
              ('AUTONOMY-01 current','autonomy_01_current.png','current'),
              ('AUTONOMY-02 SPARKLE REVIEW','autonomy_02_sparkle.webp','suspect'),
              ('AUTONOMY-03 current','autonomy_03_current.webp','current'),
            ],
          }

          manifest={
            'schema':'2rasi.priolens.open14.watermark-remediation-review-v0.1',
            'reviewRevision':'v01',
            'noRuntimePromotion':True,
            'groups':{},
          }

          def normalized(path):
              im=Image.open(path).convert('RGB')
              original=im.size
              sq=ImageOps.fit(im,(640,640),method=R,centering=(0.5,0.5))
              return sq,original

          for group,items in groups.items():
              rows=[]
              for idx,(label,name,status) in enumerate(items):
                  im,original=normalized(src/name)
                  fn=f'{group.lower()}_{idx+1:02d}_640.webp'
                  im.save(out/fn,'WEBP',quality=92,method=6)
                  b=(out/fn).read_bytes()
                  rows.append({
                    'label':label,'sourceFile':name,'status':status,
                    'output':fn,'originalSize':original,
                    'sha256':hashlib.sha256(b).hexdigest(),
                  })
              manifest['groups'][group]=rows

              cols=3
              tilew,tileh=330,380
              sheet=Image.new('RGB',(cols*tilew,((len(rows)+cols-1)//cols)*tileh),(235,238,236))
              for i,row in enumerate(rows):
                  im=Image.open(out/row['output']).convert('RGB').resize((300,300),R)
                  tile=Image.new('RGB',(tilew,tileh),'white')
                  tile.paste(im,(15,12))
                  d=ImageDraw.Draw(tile)
                  d.text((15,320),row['label'],fill='black',font=font)
                  d.text((15,340),f"{row['originalSize'][0]}x{row['originalSize'][1]}",fill=(80,80,80),font=font)
                  d.text((15,358),row['sha256'][:14],fill=(80,80,80),font=font)
                  sheet.paste(tile,((i%cols)*tilew,(i//cols)*tileh))
              sheet.save(out/f'{group.lower()}_contact.jpg',quality=93)

          (out/'REVIEW_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Build owner review index
        shell: bash
        run: |
          set -euo pipefail
          cat > out/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>PrioLens watermark remediation review</title>
          <style>
          body{font-family:system-ui;margin:0;background:#eef2ef;color:#17231f}.w{max-width:1100px;margin:auto;padding:18px}
          h1{font-family:Georgia,serif}.note{background:#fff;border:1px solid #d7dfdb;border-radius:14px;padding:14px;margin:12px 0}
          img{width:100%;height:auto;border-radius:14px;border:1px solid #d7dfdb;background:white;margin:12px 0}
          code{background:#fff;padding:2px 5px;border-radius:5px}
          </style></head><body><main class="w">
          <h1>PrioLens · watermark remediation review v01</h1>
          <div class="note"><b>Review only.</b> These files are isolated from the active Open14 bank. No candidate is promoted automatically.</div>
          <h2>SAFETY</h2><img src="safety_contact.jpg" alt="Safety candidate contact sheet">
          <h2>EXPLORATION</h2><img src="exploration_contact.jpg" alt="Exploration candidate contact sheet">
          <h2>AUTONOMY-02 full-resolution nuisance review</h2><img src="autonomy_review_contact.jpg" alt="Autonomy review contact sheet">
          <div class="note">Decision target: choose challengers worth sending to the blind validation pool. Do not select on aesthetics alone.</div>
          </main></body></html>
          HTML

      - name: Upload isolated owner-review assets
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; mkdir -p \"$REMOTE_DIR\"; mirror -R --delete --parallel=2 out/ \"$REMOTE_DIR/\""

      - name: Verify isolated review page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 "$PUBLIC_BASE/index.html" | grep -q 'watermark remediation review v01'
          for f in safety_contact.jpg exploration_contact.jpg autonomy_review_contact.jpg REVIEW_MANIFEST.json; do
            curl -fsSI --retry 4 "$PUBLIC_BASE/$f" | grep -qi '^HTTP/.* 200'
          done
          echo "Review URL: $PUBLIC_BASE/"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: priolens-v04-watermark-remediation-review-v01
          path: out/
          retention-days: 30
