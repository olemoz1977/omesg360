name: Finalize PrioLens Open14 assets v01

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-priolens-open14-assets-v01.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  ASSET_REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-research-assets/Open14-final-v01
  RUNTIME_REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-open14-v02
  PUBLIC_ASSET_BASE: https://omesg360.eu/priolens-research-assets

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install asset audit tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp imagemagick tesseract-ocr lftp

      - name: Download and normalize owner-approved sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/priolens-final
          base="$PUBLIC_ASSET_BASE/Open14-v02"

          curl -fsS --retry 4 --retry-delay 2 "$base/file_00000000dbb881f48b13b7b69cb0ef6f.png" -o /tmp/priolens-final/control-source.png
          curl -fsS --retry 4 --retry-delay 2 "$base/file_00000000dbc881f4862ffcc2c88533cc.png" -o /tmp/priolens-final/belonging-source.png
          curl -fsS --retry 4 --retry-delay 2 "$base/1788263299238.png" -o /tmp/priolens-final/exploration-source.png
          curl -fsS --retry 4 --retry-delay 2 "$base/1788265327179.png" -o /tmp/priolens-final/opportunity-source.png

          python - <<'PY'
          import struct
          from pathlib import Path
          for p in Path('/tmp/priolens-final').glob('*-source.png'):
              b=p.read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n', p
              w,h=struct.unpack('>II',b[16:24])
              print(p.name,w,h,len(b))
              assert w==h, f'{p.name} is not square: {w}x{h}'
              assert w>=640, f'{p.name} too small: {w}x{h}'
          PY

          cwebp -quiet -q 88 -resize 640 640 /tmp/priolens-final/control-source.png -o /tmp/priolens-final/control-a_joystick_v01.webp
          cwebp -quiet -q 88 -resize 640 640 /tmp/priolens-final/belonging-source.png -o /tmp/priolens-final/belonging-b_coffee-ritual_v01.webp
          cwebp -quiet -q 88 -resize 640 640 /tmp/priolens-final/exploration-source.png -o /tmp/priolens-final/exploration-b_magnifier-forest_v01.webp
          cwebp -quiet -q 88 -resize 640 640 /tmp/priolens-final/opportunity-source.png -o /tmp/priolens-final/opportunity-a_open-market-stall_v01.webp

          for f in /tmp/priolens-final/*.webp; do
            dim="$(identify -format '%wx%h' "$f")"
            echo "$(basename "$f") $dim $(stat -c%s "$f") bytes"
            [[ "$dim" == '640x640' ]]
          done

      - name: Patch technical bank and owner map
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path

          bankp=Path('priolens/open14-v02/bank.json')
          b=json.loads(bankp.read_text())

          def item(family, exemplar_id):
              for ex in b['families'][family]['exemplars']:
                  if ex['id']==exemplar_id:
                      return ex
              raise KeyError(exemplar_id)

          changes={
            'CONTROL-A': {
              'family':'CONTROL',
              'runtimePath':'/priolens-research-assets/Open14-final-v01/control-a_joystick_v01.webp',
              'sourceRuntimePath':'/priolens-research-assets/Open14-v02/file_00000000dbb881f48b13b7b69cb0ef6f.png',
              'firstImpulse':'tiesiogiai valdyti / keisti sistemos būseną',
              'risk':'owner-approved generated industrial joystick; visually credible direct-control mechanism; formative pending external data',
              'visualStatus':'OWNER_ACCEPTED_VISUAL_CREDIBILITY'
            },
            'BELONGING-B': {
              'family':'BELONGING',
              'runtimePath':'/priolens-research-assets/Open14-final-v01/belonging-b_coffee-ritual_v01.webp',
              'sourceRuntimePath':'/priolens-research-assets/Open14-v02/file_00000000dbc881f4862ffcc2c88533cc.png',
              'firstImpulse':'būti kartu / dalintis tuo pačiu kasdieniu momentu',
              'risk':'three-person shared coffee ritual removes prior asymmetric warmth cue; possible residual CONNECTION cross-load remains formative',
              'semanticStatus':'FORMATIVE_ACCEPTED_FOR_PILOT_RESEARCH'
            },
            'EXPLORATION-B': {
              'family':'EXPLORATION',
              'runtimePath':'/priolens-research-assets/Open14-final-v01/exploration-b_magnifier-forest_v01.webp',
              'sourceRuntimePath':'/priolens-research-assets/Open14-v02/1788263299238.png',
              'firstImpulse':'tyrinėti / atrasti nepažįstamą objektą',
              'risk':'magnifier may weakly cross-load Learning/Understanding, but unknown forest object keeps discovery mechanism dominant; formative',
              'semanticStatus':'FORMATIVE_ACCEPTED_FOR_PILOT_RESEARCH'
            },
            'OPPORTUNITY-A': {
              'family':'OPPORTUNITY',
              'runtimePath':'/priolens-research-assets/Open14-final-v01/opportunity-a_open-market-stall_v01.webp',
              'sourceRuntimePath':'/priolens-research-assets/Open14-v02/1788265327179.png',
              'firstImpulse':'pastebėti laisvą vietą veikiančioje aplinkoje / pasinaudoti galimybe',
              'risk':'may read as an empty stall rather than opportunity for some viewers; retained specifically as formative Opportunity boundary test',
              'semanticStatus':'FORMATIVE_ACCEPTED_FOR_PILOT_RESEARCH'
            }
          }

          for exid,c in changes.items():
              ex=item(c.pop('family'),exid)
              old=ex.get('runtimePath')
              if old!=c['runtimePath']:
                  ex['previousRuntimePath']=old
              ex.update(c)
              ex['geometryStatus']='OWNER_ACCEPTED_SQUARE_NORMALIZED_1TO1'
              ex['status']='OWNER_ACCEPTED_REPLACEMENT_SWITCHED'
              for stale in ['ownerShortlistDecision','reserveCandidateRuntimePath']:
                  ex.pop(stale,None)

          b['assetReviewStatus']='OWNER_FINALIZED_PENDING_FINAL_AUDIT'
          bankp.write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n')

          ownerp=Path('priolens/open14-v02/stimulus-bank.html')
          s=ownerp.read_text()
          s2=re.sub(r"const knownFlags=\{.*?\};", "const knownFlags={};", s, flags=re.S)
          if s2==s:
              raise SystemExit('knownFlags block not found')
          ownerp.write_text(s2)
          PY

          python -m json.tool priolens/open14-v02/bank.json >/dev/null
          grep -q "const knownFlags={};" priolens/open14-v02/stimulus-bank.html

      - name: Upload final derivatives and updated owner bank
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FTP_USER:-}" && -n "${FTP_PASSWORD:-}" ]]
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; set cmd:fail-exit no; mkdir -p \"$ASSET_REMOTE_DIR\"; set cmd:fail-exit yes; put -O \"$ASSET_REMOTE_DIR/\" /tmp/priolens-final/control-a_joystick_v01.webp; put -O \"$ASSET_REMOTE_DIR/\" /tmp/priolens-final/belonging-b_coffee-ritual_v01.webp; put -O \"$ASSET_REMOTE_DIR/\" /tmp/priolens-final/exploration-b_magnifier-forest_v01.webp; put -O \"$ASSET_REMOTE_DIR/\" /tmp/priolens-final/opportunity-a_open-market-stall_v01.webp; put -O \"$RUNTIME_REMOTE_DIR/\" priolens/open14-v02/bank.json; put -O \"$RUNTIME_REMOTE_DIR/\" priolens/open14-v02/stimulus-bank.html"

      - name: Final 28 of 28 live asset audit
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          mkdir -p /tmp/audit
          curl -fsS --retry 4 --retry-delay 2 'https://omesg360.eu/priolens-open14-v02/bank.json' -o /tmp/audit/bank.json
          curl -fsS --retry 4 --retry-delay 2 'https://omesg360.eu/priolens-open14-v02/stimulus-bank.html' -o /tmp/audit/stimulus-bank.html

          python - <<'PY' >/tmp/audit/paths.tsv
          import json
          b=json.load(open('/tmp/audit/bank.json'))
          assert len(b['families'])==14
          rows=[]
          for fid,fam in b['families'].items():
              assert len(fam['exemplars'])==2, fid
              for ex in fam['exemplars']:
                  rows.append((ex['id'],ex['runtimePath']))
          assert len(rows)==28
          for r in rows: print(*r,sep='\t')
          PY

          count=0
          while IFS=$'\t' read -r id path; do
            f="/tmp/audit/${id}.img"
            curl -fsS --retry 4 --retry-delay 2 "https://omesg360.eu${path}" -o "$f"
            dim="$(identify -format '%wx%h' "$f")"
            w="${dim%x*}"; h="${dim#*x}"
            [[ "$w" == "$h" ]] || { echo "NON_SQUARE $id $dim $path" >&2; exit 1; }
            text="$(tesseract "$f" stdout 2>/dev/null || true)"
            if printf '%s' "$text" | grep -Eiq 'KlingAI|Kling AI|Gemini|OpenAI'; then
              echo "WATERMARK_TEXT_REVIEW $id: $text" >&2
              exit 1
            fi
            echo "PASS $id $dim $(stat -c%s "$f") $path"
            count=$((count+1))
          done </tmp/audit/paths.tsv
          [[ "$count" -eq 28 ]]

          python - <<'PY'
          import json
          b=json.load(open('/tmp/audit/bank.json'))
          raw=json.dumps(b,ensure_ascii=False)
          blockers=['REPLACE_REQUIRED','SEARCH_REQUIRED_AFTER_SHORTLIST_REJECT','HOLD_SEARCH_BETTER_CANDIDATE','HOLD_OWNER_REVIEW_ASYMMETRIC_WARMTH','REASSIGN_REQUIRED_SEMANTIC_MISMATCH']
          for x in blockers:
              assert x not in raw, x
          expected={
            'CONTROL-A':'/priolens-research-assets/Open14-final-v01/control-a_joystick_v01.webp',
            'BELONGING-B':'/priolens-research-assets/Open14-final-v01/belonging-b_coffee-ritual_v01.webp',
            'EXPLORATION-B':'/priolens-research-assets/Open14-final-v01/exploration-b_magnifier-forest_v01.webp',
            'OPPORTUNITY-A':'/priolens-research-assets/Open14-final-v01/opportunity-a_open-market-stall_v01.webp'
          }
          got={ex['id']:ex['runtimePath'] for f in b['families'].values() for ex in f['exemplars']}
          assert all(got[k]==v for k,v in expected.items())
          print('PASS: 14 families / 28 active square assets / no known blocking statuses')
          PY

          ! grep -q '2_WATERMARKS_VISIBLE' /tmp/audit/stimulus-bank.html
          ! grep -q "'CONNECTION-B':\['WATERMARK_REVIEW_REQUIRED'\]" /tmp/audit/stimulus-bank.html
          grep -q 'Open14 stimulus bank' /tmp/audit/stimulus-bank.html
          echo 'PASS: owner stimulus bank updated; stale hardcoded watermark flags removed'

      - name: Commit final bank state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v02/bank.json priolens/open14-v02/stimulus-bank.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'fix(priolens): finalize owner-reviewed Open14 stimuli'
            git push
          fi
