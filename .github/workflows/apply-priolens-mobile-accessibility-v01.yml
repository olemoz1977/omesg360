name: Apply PrioLens mobile accessibility v01

on:
  push:
    branches: [main]
    paths:
      - priolens/open14-v02/tools/patch_mobile_accessibility_v01.py
      - .github/workflows/apply-priolens-mobile-accessibility-v01.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-open14-v02

jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply accessibility patch
        run: python priolens/open14-v02/tools/patch_mobile_accessibility_v01.py

      - name: Validate patched runtime
        shell: bash
        run: |
          set -euo pipefail
          f='priolens/open14-v02/index.html'
          grep -q 'grid-row:4' "$f"
          grep -q 'Neatsakyta' "$f"
          grep -q 'id="suffError"' "$f"
          grep -q 'validationError' "$f"
          grep -q "suffValidationShown=true" "$f"
          grep -q 'font-size:18px' "$f"
          grep -q 'navigator.canShare' "$f"
          echo 'PASS: mobile accessibility and JSON export code present'

      - name: Commit runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v02/index.html
          git commit -m 'fix(priolens): improve mobile readability and unanswered-state UX'
          git push origin HEAD:main

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Publish patched runtime
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; put -O \"$REMOTE_DIR/\" priolens/open14-v02/index.html"

      - name: Live smoke
        shell: bash
        run: |
          set -euo pipefail
          url='https://omesg360.eu/priolens-open14-v02/'
          curl -fsS --retry 5 --retry-delay 2 "$url" -o /tmp/live
          grep -q 'grid-row:4' /tmp/live
          grep -q 'Neatsakyta' /tmp/live
          grep -q 'id="suffError"' /tmp/live
          grep -q "suffValidationShown=true" /tmp/live
          grep -q 'navigator.canShare' /tmp/live
          echo 'PASS: accessibility patch live'
