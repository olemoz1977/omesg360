name: Deploy PrioLens Open14 v0.3.1 preview

on:
  push:
    branches: [feature/priolens-open14-v03]
    paths:
      - priolens/open14-v03/index.html
      - priolens/open14-v03/bank.json
      - priolens/open14-v03/stimulus-bank.html
      - .github/workflows/deploy-priolens-open14-v03-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omesg360-priolens-open14-v03-preview
  cancel-in-progress: true

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-open14-v03

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-open14-v03

      - name: Validate isolated v0.3.1 preview source and bank
        shell: bash
        run: |
          set -euo pipefail
          f='priolens/open14-v03/index.html'
          grep -Fq '2rasi.priolens.open14.rank-session-v0.3' "$f"
          grep -Fq "priolens.open14.v031.rank.draft" "$f"
          grep -Fq 'Kas liko antrame plane?' "$f"
          grep -Fq 'repeat(auto-fit,minmax(84px,1fr))' "$f"
          grep -Fq 'const images=chosenImagePaths(id).map' "$f"
          grep -Fq 'const images=leastImagePaths(id).map' "$f"
          grep -Fq 'const pics=images.map' "$f"
          if grep -Fq 'slice(0,2)' "$f"; then
            echo 'Legacy two-image result cap is still present' >&2
            exit 1
          fi
          python <<'PY'
          import json
          b=json.load(open('priolens/open14-v03/bank.json'))
          assert b['schema']=='2rasi.priolens.open14.bank-v0.3.1'
          assert b['runtimeReady'] is True
          g=b['deploymentGate']
          assert g['full42AuditPassed'] is True and g['full42AuditRunId']==33790603165
          assert g['apiDeployed'] is True and g['apiDeployRunId']==33791065786
          assert g['apiSmokePassed'] is True and g['apiSmokeRunId']==33791193830
          expected={
            'REST-01':'/priolens-research-assets/Open14-v03-owner-remediation-v01/rest_01_slippers_640.webp',
            'RESOURCE-03':'/priolens-research-assets/Open14-v03-owner-remediation-v01/resource_03_food_640.webp',
            'KNOWLEDGE-02':'/priolens-research-assets/Open14-v03-owner-remediation-v01/knowledge_02_online_learning_640.webp',
            'OPPORTUNITY-01':'/priolens-research-assets/Open14-v03-owner-remediation-v01/opportunity_01_workbench_640.webp',
            'RECOGNITION-02':'/priolens-research-assets/Open14-v03-owner-remediation-v01/recognition_02_recrop_640.webp',
          }
          by={x['id']:x for n in b['families'].values() for x in n['exemplars']}
          assert len(by)==42
          for k,v in expected.items(): assert by[k]['runtimePath']==v,(k,by[k]['runtimePath'])
          PY
          echo 'PASS: v0.3.1 index + remediated bank source guards'

      - name: Validate owner stimulus bank
        shell: bash
        run: |
          set -euo pipefail
          f='priolens/open14-v03/stimulus-bank.html'
          grep -Fq '14 šeimų × 3 exemplarai = 42' "$f"
          grep -Fq "'RECOGNITION-02'" "$f"
          grep -Fq "'OPPORTUNITY-01'" "$f"
          grep -Fq "fetch('./bank.json'" "$f"
          grep -Fq 'Kopijuoti ID' "$f"
          echo 'PASS: owner stimulus bank source'

      - name: Verify FTP secrets and install client
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FTP_USER:-}" ]]
          [[ -n "${FTP_PASSWORD:-}" ]]
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null

      - name: Upload v0.3.1 preview index, bank and owner bank
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; put -O \"$REMOTE_DIR/\" priolens/open14-v03/index.html; put -O \"$REMOTE_DIR/\" priolens/open14-v03/bank.json; put -O \"$REMOTE_DIR/\" priolens/open14-v03/stimulus-bank.html"

      - name: Verify live preview index byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          src='priolens/open14-v03/index.html'
          url="https://omesg360.eu/priolens-open14-v03/?deploy=${GITHUB_SHA}"
          src_sha=$(sha256sum "$src" | awk '{print $1}')
          ok=0
          for i in $(seq 1 12); do
            curl -fsS --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' "$url&attempt=$i" -o /tmp/live
            live_sha=$(sha256sum /tmp/live | awk '{print $1}')
            echo "index attempt=$i source=$src_sha live=$live_sha"
            if [[ "$live_sha" == "$src_sha" ]]; then ok=1; break; fi
            sleep 2
          done
          [[ "$ok" == 1 ]]
          grep -Fq '2rasi.priolens.open14.rank-session-v0.3' /tmp/live
          grep -Fq 'priolens.open14.v031.rank.draft' /tmp/live
          ! grep -Fq "priolens.open14.v03.rank.draft'" /tmp/live
          echo 'PASS: v0.3.1 preview index byte-for-byte live'

      - name: Verify live bank byte-for-byte and v0.3.1 identity
        shell: bash
        run: |
          set -euo pipefail
          src='priolens/open14-v03/bank.json'
          url="https://omesg360.eu/priolens-open14-v03/bank.json?deploy=${GITHUB_SHA}"
          src_sha=$(sha256sum "$src" | awk '{print $1}')
          ok=0
          for i in $(seq 1 12); do
            curl -fsS --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' "$url&attempt=$i" -o /tmp/live-bank-json
            live_sha=$(sha256sum /tmp/live-bank-json | awk '{print $1}')
            echo "bank attempt=$i source=$src_sha live=$live_sha"
            if [[ "$live_sha" == "$src_sha" ]]; then ok=1; break; fi
            sleep 2
          done
          [[ "$ok" == 1 ]]
          python <<'PY'
          import json
          b=json.load(open('/tmp/live-bank-json'))
          assert b['schema']=='2rasi.priolens.open14.bank-v0.3.1'
          assert b['runtimeReady'] is True
          rows=[x for n in b['families'].values() for x in n['exemplars']]
          assert len(rows)==42 and len({x['id'] for x in rows})==42 and len({x['runtimePath'] for x in rows})==42
          PY
          echo 'PASS: v0.3.1 bank byte-for-byte live'

      - name: Verify live owner stimulus bank bytes
        shell: bash
        run: |
          set -euo pipefail
          src='priolens/open14-v03/stimulus-bank.html'
          url="https://omesg360.eu/priolens-open14-v03/stimulus-bank.html?deploy=${GITHUB_SHA}"
          src_sha=$(sha256sum "$src" | awk '{print $1}')
          ok=0
          for i in $(seq 1 12); do
            curl -fsS --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' "$url&attempt=$i" -o /tmp/live-owner-bank
            live_sha=$(sha256sum /tmp/live-owner-bank | awk '{print $1}')
            echo "owner-bank attempt=$i source=$src_sha live=$live_sha"
            if [[ "$live_sha" == "$src_sha" ]]; then ok=1; break; fi
            sleep 2
          done
          [[ "$ok" == 1 ]]
          grep -Fq '14 šeimų × 3 exemplarai = 42' /tmp/live-owner-bank
          echo 'PASS: owner stimulus bank byte-for-byte live'

# Deploys only the isolated /priolens-open14-v03/ owner preview surface.
# Does not touch /priolens-open14-v02/, APIs, research assets or public routing.
