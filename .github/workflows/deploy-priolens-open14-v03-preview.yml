name: Deploy PrioLens Open14 v0.3 preview

on:
  push:
    branches: [feature/priolens-open14-v03]
    paths:
      - priolens/open14-v03/index.html
      - .github/workflows/deploy-priolens-open14-v03-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omesg360-priolens-open14-v03-preview
  cancel-in-progress: true

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-open14-v03

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-open14-v03

      - name: Validate isolated v0.3 preview source
        shell: bash
        run: |
          set -euo pipefail
          f='priolens/open14-v03/index.html'
          grep -Fq '2rasi.priolens.open14.rank-session-v0.3' "$f"
          grep -Fq 'Kas liko antrame plane?' "$f"
          grep -Fq 'repeat(auto-fit,minmax(84px,1fr))' "$f"
          grep -Fq 'const images=chosenImagePaths(id).map' "$f"
          grep -Fq 'const images=leastImagePaths(id).map' "$f"
          grep -Fq 'const pics=images.map' "$f"
          if grep -Fq 'slice(0,2)' "$f"; then
            echo 'Legacy two-image result cap is still present' >&2
            exit 1
          fi
          echo 'PASS: v0.3 all-repeated-exemplar result source'

      - name: Verify FTP secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FTP_USER:-}" ]]
          [[ -n "${FTP_PASSWORD:-}" ]]

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload preview index only
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; put -O \"$REMOTE_DIR/\" priolens/open14-v03/index.html"

      - name: Verify live bytes and result-image guards
        shell: bash
        run: |
          set -euo pipefail
          src='priolens/open14-v03/index.html'
          url="https://omesg360.eu/priolens-open14-v03/?deploy=${GITHUB_SHA}"
          src_sha=$(sha256sum "$src" | awk '{print $1}')
          ok=0
          for i in $(seq 1 12); do
            curl -fsS --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' "$url&attempt=$i" -o /tmp/live
            live_sha=$(sha256sum /tmp/live | awk '{print $1}')
            echo "attempt=$i source=$src_sha live=$live_sha"
            if [[ "$live_sha" == "$src_sha" ]]; then ok=1; break; fi
            sleep 2
          done
          [[ "$ok" == 1 ]]
          grep -Fq '2rasi.priolens.open14.rank-session-v0.3' /tmp/live
          grep -Fq 'repeat(auto-fit,minmax(84px,1fr))' /tmp/live
          grep -Fq 'const images=chosenImagePaths(id).map' /tmp/live
          grep -Fq 'const images=leastImagePaths(id).map' /tmp/live
          grep -Fq 'const pics=images.map' /tmp/live
          if grep -Fq 'slice(0,2)' /tmp/live; then
            echo 'Live preview still contains legacy two-image result cap' >&2
            exit 1
          fi
          echo 'PASS: isolated v0.3 preview FTP deploy byte-for-byte live'

# Intentionally deploys only the separate v0.3 preview index.
# Does not touch /priolens-open14-v02/, API files, research assets or public routing.
