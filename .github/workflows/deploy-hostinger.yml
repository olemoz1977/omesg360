name: Deploy OMESG360 frontend to Hostinger

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview frontend changes without modifying Hostinger
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: omesg360-frontend-production
  cancel-in-progress: false

env:
  FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate frontend release
        run: bash scripts/validate-v02.sh

      - name: Verify FTP secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FTP_HOST:-}" ]] || { echo 'Missing HOSTINGER_FTP_HOST repository secret' >&2; exit 1; }
          [[ -n "${FTP_USER:-}" ]] || { echo 'Missing HOSTINGER_FTP_USER repository secret' >&2; exit 1; }
          [[ -n "${FTP_PASSWORD:-}" ]] || { echo 'Missing HOSTINGER_FTP_PASSWORD repository secret' >&2; exit 1; }

      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Build frontend-only package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy-package
          mkdir -p .deploy-package/assets/img .deploy-package/leadership-360
          cp index.html privacy.html robots.txt sitemap.xml sitemap_location.xml .deploy-package/
          cp assets/img/favicon.svg assets/img/logo.svg assets/img/og-cover.png assets/img/og-cover.svg .deploy-package/assets/img/
          cp leadership-360/index.html .deploy-package/leadership-360/index.html
          [[ -f BingSiteAuth.xml ]] && cp BingSiteAuth.xml .deploy-package/
          [[ -f 9dc780a3ecce49a5897128d85c5d362f.txt ]] && cp 9dc780a3ecce49a5897128d85c5d362f.txt .deploy-package/
          echo 'Frontend-only package:'
          find .deploy-package -type f -print | sort

      - name: Detect safe Hostinger web root
        shell: bash
        run: |
          set -euo pipefail
          common='set ssl:verify-certificate yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; set net:timeout 20;'
          if lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -1 /public_html/index.html" >/dev/null 2>&1; then
            base='/public_html'
          elif lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -1 /index.html" >/dev/null 2>&1; then
            base=''
          else
            echo 'FTP account does not expose the expected OMESG360 web root.' >&2
            exit 1
          fi

          # Fail closed unless both live research satellites are visible in the same web root.
          lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -ld \"${base}/wave1\"; cls -ld \"${base}/conflictlab/releases/calibration-v0.1\"" >/dev/null
          echo "REMOTE_BASE=$base" >> "$GITHUB_ENV"
          echo 'Hostinger web root verified. Wave1 and Calibration detected and protected.'

      - name: Preview frontend changes
        shell: bash
        run: |
          set -euo pipefail
          common='set ssl:verify-certificate yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; set net:timeout 20;'
          lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; mirror --reverse --dry-run --verbose --no-perms --parallel=2 .deploy-package \"${REMOTE_BASE}/\""
          echo 'DRY-RUN ONLY: no remote file was modified.'
          echo 'PROTECTED: wave1/, conflictlab/releases/calibration-v0.1/, PHP runtime/config files, databases and every file outside the frontend package.'

  deploy:
    needs: validate-and-preview
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Build frontend-only package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy-package
          mkdir -p .deploy-package/assets/img .deploy-package/leadership-360
          cp index.html privacy.html robots.txt sitemap.xml sitemap_location.xml .deploy-package/
          cp assets/img/favicon.svg assets/img/logo.svg assets/img/og-cover.png assets/img/og-cover.svg .deploy-package/assets/img/
          cp leadership-360/index.html .deploy-package/leadership-360/index.html
          [[ -f BingSiteAuth.xml ]] && cp BingSiteAuth.xml .deploy-package/
          [[ -f 9dc780a3ecce49a5897128d85c5d362f.txt ]] && cp 9dc780a3ecce49a5897128d85c5d362f.txt .deploy-package/

      - name: Detect safe Hostinger web root again
        shell: bash
        run: |
          set -euo pipefail
          common='set ssl:verify-certificate yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; set net:timeout 20;'
          if lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -1 /public_html/index.html" >/dev/null 2>&1; then
            base='/public_html'
          elif lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -1 /index.html" >/dev/null 2>&1; then
            base=''
          else
            echo 'FTP account does not expose the expected OMESG360 web root.' >&2
            exit 1
          fi
          lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -ld \"${base}/wave1\"; cls -ld \"${base}/conflictlab/releases/calibration-v0.1\"" >/dev/null
          echo "REMOTE_BASE=$base" >> "$GITHUB_ENV"

      - name: Backup managed frontend files to runner
        shell: bash
        run: |
          set -euo pipefail
          common='set ssl:verify-certificate yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; set net:timeout 20;'
          rm -rf .rollback
          mkdir -p .rollback/root .rollback/assets/img .rollback/leadership-360

          for f in index.html privacy.html robots.txt sitemap.xml sitemap_location.xml BingSiteAuth.xml 9dc780a3ecce49a5897128d85c5d362f.txt; do
            if lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -1 \"${REMOTE_BASE}/$f\"" >/dev/null 2>&1; then
              lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; get \"${REMOTE_BASE}/$f\" -o \".rollback/root/$f\""
            fi
          done

          if lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -ld \"${REMOTE_BASE}/assets/img\"" >/dev/null 2>&1; then
            lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; mirror --verbose \"${REMOTE_BASE}/assets/img\" .rollback/assets/img"
          fi

          if lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -ld \"${REMOTE_BASE}/leadership-360\"" >/dev/null 2>&1; then
            echo 'LEADERSHIP_EXISTED=1' >> "$GITHUB_ENV"
            lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; mirror --verbose \"${REMOTE_BASE}/leadership-360\" .rollback/leadership-360"
          else
            echo 'LEADERSHIP_EXISTED=0' >> "$GITHUB_ENV"
          fi
          echo 'BACKUP_READY=1' >> "$GITHUB_ENV"

      - name: Upload frontend package
        shell: bash
        run: |
          set -euo pipefail
          common='set ssl:verify-certificate yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; set net:timeout 20;'
          lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; mirror --reverse --verbose --no-perms --parallel=2 .deploy-package \"${REMOTE_BASE}/\""
          echo 'Frontend upload completed. No remote delete operation was used.'

      - name: Post-deploy HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          assert_contains() {
            local url="$1" needle="$2" body
            body="$(curl -fsS --retry 3 --retry-delay 2 "$url")"
            grep -Fq "$needle" <<<"$body" || { echo "Smoke content mismatch: $url" >&2; exit 1; }
          }
          assert_ok() { curl -fsS --retry 3 --retry-delay 2 -o /dev/null "$1"; }

          assert_contains 'https://omesg360.eu/?lang=lt' 'Stabilizuoti.'
          assert_contains 'https://omesg360.eu/?lang=en' 'Stabilize.'
          assert_contains 'https://omesg360.eu/privacy.html?lang=lt' 'Privatumo centras'
          assert_contains 'https://omesg360.eu/leadership-360/?lang=lt' 'Leadership 360°'
          assert_contains 'https://omesg360.eu/leadership-360/?lang=en' 'From feedback to action.'
          assert_ok 'https://olemoz1977.github.io/gla360-personal-full/setup-v2.html?lang=lt'
          assert_ok 'https://omesg360.eu/wave1/?lang=lt'
          assert_ok 'https://omesg360.eu/wave1/?lang=en'
          assert_ok 'https://omesg360.eu/conflictlab/releases/calibration-v0.1/'
          assert_contains 'https://omesg360.eu/robots.txt' 'https://omesg360.eu/sitemap.xml'
          assert_contains 'https://omesg360.eu/sitemap.xml' 'https://omesg360.eu/leadership-360/'
          echo 'Production smoke PASS'

      - name: Restore previous frontend if upload or smoke fails
        if: ${{ failure() && env.BACKUP_READY == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          common='set ssl:verify-certificate yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; set net:timeout 20;'

          for f in .rollback/root/*; do
            [[ -f "$f" ]] || continue
            lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; put -O \"${REMOTE_BASE}/\" \"$f\""
          done

          if find .rollback/assets/img -type f | grep -q .; then
            lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; mirror --reverse --verbose --no-perms .rollback/assets/img \"${REMOTE_BASE}/assets/img\""
          fi

          if [[ "${LEADERSHIP_EXISTED:-0}" == '1' ]]; then
            lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; mirror --reverse --verbose --no-perms .rollback/leadership-360 \"${REMOTE_BASE}/leadership-360\""
          else
            lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; rm -f \"${REMOTE_BASE}/leadership-360/index.html\"" || true
          fi
          echo 'Previous managed frontend restored. Protected satellites were never touched.'
