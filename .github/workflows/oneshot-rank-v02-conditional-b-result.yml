name: One-shot Rank v0.2 conditional Channel B result

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-rank-v02-conditional-b-result.yml

permissions:
  contents: write

concurrency:
  group: oneshot-rank-v02-conditional-b-result
  cancel-in-progress: true

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-open14-rank-v02

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Patch result surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('priolens/open14-rank-v02/index.html')
          s=p.read_text()

          old='''  <p class="resultLead">Tai ne diagnozė. Čia tik parodome, kas šį kartą kartojosi tavo pasirinkimuose ir ką pats pasakei apie dabartinę situaciją.</p>'''
          new='''  <p class="resultLead">Tai ne diagnozė. Parodome, kas šį kartą kartojosi tavo pasirinkimuose. Antros dalies atsakymus įtraukiame tik tada, kai jie padeda pamatyti aiškų sutapimą ar skirtumą.</p>'''
          assert old in s
          s=s.replace(old,new,1)

          old='''  <div class="section"><div class="label">TAVO ATSAKYMAI</div><h2>Kaip pats vertini dabar?</h2><div id="answers" class="answerList"></div></div>\n'''
          assert old in s
          s=s.replace(old,'',1)

          old="""function pairCandidates(S,side){return Object.entries(S).filter(([,x])=>side==='most'?x.strongMost:x.strongLeast).map(([f,x])=>{const link=LINK[f]||{item:null,kind:'NONE'},v=link.item?state.sufficiency[link.item]:null;return{f,x,side,link,v,state:responseState(v),count:side==='most'?x.most:x.least}}).filter(z=>z.link.kind!=='NONE'&&z.state!=='none')}\n"""
          assert old in s
          new=old+"""function unmatchedLowContext(){const mapped=new Set(Object.values(LINK).filter(x=>x.item).map(x=>x.item));const rows=Object.entries(state.sufficiency).filter(([k,v])=>Number.isFinite(v)&&v<=2&&!mapped.has(k)).sort((a,b)=>a[1]-b[1]);if(!rows.length)return'';const shown=rows.slice(0,2).map(([k,v])=>`„${ITEM_LABEL[k]}“ – ${ANSWER_LABEL[v].toLowerCase()}`).join('; ');return `Dar iš tavo atsakymų: ${shown}. Šioms temoms neturime tiesioginės vizualinės poros, todėl jų su vaizdų pasirinkimais nelyginame.`}\n"""
          s=s.replace(old,new,1)

          old="""show('result');renderSignals('mostGrid',most,'most');renderSignals('leastGrid',least,'least');renderAnswers();const h=chooseHero(S);$('heroTitle').textContent=h.title;$('heroText').textContent=h.text;$('heroQuestion').textContent=h.q;$('heroLinkNote').textContent=h.note||'';"""
          assert old in s
          new="""show('result');renderSignals('mostGrid',most,'most');renderSignals('leastGrid',least,'least');const h=chooseHero(S);$('heroTitle').textContent=h.title;$('heroText').textContent=h.text;$('heroQuestion').textContent=h.q;const extra=unmatchedLowContext();$('heroLinkNote').textContent=[h.note||'',extra].filter(Boolean).join(' ');"""
          s=s.replace(old,new,1)

          assert 'Kaip pats vertini dabar?' not in s
          assert "renderAnswers();" not in s
          assert 'unmatchedLowContext' in s
          assert 'Antros dalies atsakymus įtraukiame tik tada' in s
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/rank-v02.mjs').write_text(s[a:b])
          p.write_text(s)
          PY
          node --check /tmp/rank-v02.mjs

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name olemoz1977
          git config user.email olemoz1977@gmail.com
          git add priolens/open14-rank-v02/index.html
          git commit -m "Use Channel B only when it adds reflection value"
          git push origin HEAD:main

      - name: Verify FTP secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FTP_USER:-}" ]]
          [[ -n "${FTP_PASSWORD:-}" ]]

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload patched prototype
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; set cmd:fail-exit no; mkdir -p \"$REMOTE_DIR\"; set cmd:fail-exit yes; put -O \"$REMOTE_DIR/\" priolens/open14-rank-v02/index.html"

      - name: Live smoke
        shell: bash
        run: |
          set -euo pipefail
          base='https://omesg360.eu/priolens-open14-rank-v02/'
          curl -fsS --retry 4 --retry-delay 2 "$base" -o /tmp/live
          grep -Fq 'OWNER · Rank v0.2' /tmp/live
          grep -Fq 'Kas liko antrame plane?' /tmp/live
          grep -Fq 'Antros dalies atsakymus įtraukiame tik tada' /tmp/live
          grep -Fq 'unmatchedLowContext' /tmp/live
          if grep -Fq 'Kaip pats vertini dabar?' /tmp/live; then echo 'stale standalone Channel B block'; exit 1; fi
          grep -Fq '2rasi.priolens.open14.rank-session-v0.2' /tmp/live
          echo 'PASS: Channel B is conditional in Rank v0.2 result; public Open14 and 2rasi untouched'
