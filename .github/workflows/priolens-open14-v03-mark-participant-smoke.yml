name: Mark PrioLens Open14 v0.3 deployed participant smoke pass

on:
  push:
    branches: [feature/priolens-open14-v03]
    paths:
      - '.github/workflows/priolens-open14-v03-mark-participant-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mark-participant-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-open14-v03
      - name: Guard and mark deployed participant preview pass
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path
          p=Path('priolens/open14-v03/bank.json')
          bank=json.loads(p.read_text())
          assert bank['schema']=='2rasi.priolens.open14.bank-v0.3'
          assert bank['runtimeReady'] is True
          assert bank['deploymentGate']['full42AuditPassed'] is True
          assert bank['deploymentGate']['apiDeployed'] is True
          assert bank['deploymentGate']['apiSmokePassed'] is True
          bank['status']='PARTICIPANT_PREVIEW_DEPLOY_PASS_OWNER_MOBILE_PENDING'
          bank['startPolicy']='PREVIEW_OPEN_FOR_OWNER_MOBILE_SMOKE_EXTERNAL_RECRUITMENT_CLOSED'
          gate=bank['deploymentGate']
          gate['participantPreviewDeployed']=True
          gate['participantPreviewStaticSmokePassed']=True
          gate['participantPreviewChromiumSmokePassed']=True
          gate['ownerMobileVisualSmokePassed']=False
          p.write_text(json.dumps(bank,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v03/bank.json
          git diff --cached --check
          git commit -m 'PrioLens v0.3: participant preview deployed smoke pass'
          git push origin HEAD:feature/priolens-open14-v03
