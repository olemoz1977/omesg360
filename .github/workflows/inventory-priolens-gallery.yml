name: Inventory PrioLens Gallery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inventory-priolens-gallery.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_GALLERY: /domains/omesg360.eu/public_html/priolens-research-assets/Gallery

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Read Gallery filenames from Hostinger
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FTP_USER:-}" ]] || { echo 'Missing HOSTINGER_FTP_USER' >&2; exit 1; }
          [[ -n "${FTP_PASSWORD:-}" ]] || { echo 'Missing HOSTINGER_FTP_PASSWORD' >&2; exit 1; }
          mkdir -p priolens
          common='set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; set cmd:fail-exit yes;'
          lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -1 \"${REMOTE_GALLERY}\"" | sed '/^$/d' | sort -V > priolens/gallery-inventory.txt
          test -s priolens/gallery-inventory.txt
          echo "Gallery files: $(wc -l < priolens/gallery-inventory.txt)"
          cat priolens/gallery-inventory.txt

      - name: Commit inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/gallery-inventory.txt
          if git diff --cached --quiet; then
            echo 'Gallery inventory unchanged.'
            exit 0
          fi
          git commit -m 'chore(priolens): inventory Hostinger Gallery filenames'
          git push origin HEAD:main
