name: Verify PrioLens Open14 host assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-priolens-open14-host-assets.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify five runtime assets
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://omesg360.eu/priolens-research-assets/Open14-v02/priolens_care-a_v01.webp'
            'https://omesg360.eu/priolens-research-assets/Open14-v02/priolens_care-b_v01.webp'
            'https://omesg360.eu/priolens-research-assets/Open14-v02/priolens_recognition-a_v01.webp'
            'https://omesg360.eu/priolens-research-assets/Open14-v02/priolens_recognition-b_v01.webp'
            'https://omesg360.eu/priolens-research-assets/Recovered/priolens_aut_backpack_v01.webp'
          )
          for u in "${urls[@]}"; do
            echo "CHECK $u"
            curl -fsS --retry 4 --retry-delay 2 -D /tmp/h -o /tmp/a "$u"
            test -s /tmp/a
            grep -qi '^content-type: image/webp' /tmp/h || { cat /tmp/h; exit 1; }
            file /tmp/a | grep -q 'Web/P image'
            echo "PASS $(stat -c%s /tmp/a) bytes"
          done
          echo 'PASS: all Open14 host assets reachable and valid WebP'
