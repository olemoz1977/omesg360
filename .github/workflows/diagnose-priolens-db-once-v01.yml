name: Diagnose PrioLens DB once v01

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-priolens-db-once-v01.yml

permissions:
  contents: read

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-open14-api

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Query counts through temporary endpoint
        shell: bash
        run: |
          set -euo pipefail
          rnd="dbdiag-$(python - <<'PY'
          import secrets
          print(secrets.token_hex(16))
          PY
          ).php"
          cleanup(){ lftp -c "set ftp:ssl-allow no; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; rm -f \"$REMOTE_DIR/$rnd\"" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          cat > /tmp/dbdiag.php <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          require_once __DIR__.'/config.php';
          $pdo = new PDO('mysql:host='.DB_HOST.';dbname='.DB_NAME.';charset=utf8mb4', DB_USER, DB_PASS, [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          $one = fn($sql) => (int)$pdo->query($sql)->fetchColumn();
          $out = [
            'total' => $one("SELECT COUNT(*) FROM priolens_open14_sessions"),
            'completed' => $one("SELECT COUNT(*) FROM priolens_open14_sessions WHERE completed_at_client IS NOT NULL AND completed_at_client <> ''"),
            'incomplete' => $one("SELECT COUNT(*) FROM priolens_open14_sessions WHERE completed_at_client IS NULL OR completed_at_client = ''"),
            'systemSmoke' => $one("SELECT COUNT(*) FROM priolens_open14_sessions WHERE seed='SYSTEM_SMOKE_DO_NOT_ANALYZE'"),
            'nonSystem' => $one("SELECT COUNT(*) FROM priolens_open14_sessions WHERE seed<>'SYSTEM_SMOKE_DO_NOT_ANALYZE'"),
            'last24h' => $one("SELECT COUNT(*) FROM priolens_open14_sessions WHERE created_at >= NOW() - INTERVAL 1 DAY")
          ];
          $q=$pdo->query("SELECT session_uuid, seed, created_at, completed_at_client FROM priolens_open14_sessions ORDER BY created_at DESC LIMIT 8");
          $out['latest']=$q->fetchAll(PDO::FETCH_ASSOC);
          echo json_encode($out, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          PHP
          cp /tmp/dbdiag.php "/tmp/$rnd"
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; put -O \"$REMOTE_DIR/\" \"/tmp/$rnd\""
          sleep 1
          curl -fsS --retry 3 --retry-delay 1 "https://omesg360.eu/priolens-open14-api/$rnd" | tee /tmp/dbdiag-result.json
          echo
          python -m json.tool /tmp/dbdiag-result.json
