name: Pull PrioLens Spectrum Candidates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pull-priolens-spectrum-candidates.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_GALLERY: /domains/omesg360.eu/public_html/priolens-research-assets/Gallery

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Pull selected Gallery candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p priolens/gallery-review/open-spectrum-v01
          files=(
            '20260731_043300801.png'
            '20260730_230816104.png'
            '20260829_235204397.png'
            '20260730_234851456.png'
            '20260730_151043136.png'
            '20260730_225843628.png'
            '20260730_021743687.png'
            '20260829_235549505.png'
            '20260730_063306116.png'
            '20260830_242641908.png'
            'file_00000000fb088246a218b6e0c6f2e60e.png'
            '1785953971401.png'
            '20260731_045902087.png'
            '20260730_234205886.png'
            '1786534423740.png'
            'file_00000000c7f0821081be7676884bb00f.png'
            '20260812_130124523.png'
            '20260730_230415808.png'
            '20260731_044221625.png'
            '1785954922572.png'
            'S15.webp'
            '20260731_042747442.png'
          )
          common='set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; set cmd:fail-exit yes;'
          for f in "${files[@]}"; do
            echo "Pulling $f"
            lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; get \"${REMOTE_GALLERY}/$f\" -o \"priolens/gallery-review/open-spectrum-v01/$f\""
          done
          find priolens/gallery-review/open-spectrum-v01 -type f -maxdepth 1 -printf '%f\n' | sort -V
      - name: Commit candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/gallery-review/open-spectrum-v01
          if git diff --cached --quiet; then
            echo 'No candidate changes.'
            exit 0
          fi
          git commit -m 'chore(priolens): mirror open-spectrum Gallery candidates'
          git push origin HEAD:main
