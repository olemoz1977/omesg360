name: Find PrioLens v0.3 owner source binaries

on:
  push:
    branches: [feature/priolens-open14-v03]
    paths:
      - '.github/workflows/priolens-open14-v03-find-owner-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Search research assets for owner/source handles
        shell: bash
        run: |
          set -euo pipefail
          root='/domains/omesg360.eu/public_html/priolens-research-assets'
          lftp -c "set ftp:ssl-allow no; set net:max-retries 3; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; find \"$root\"" > remote-assets.txt
          grep -Ei '(^|/)(4967|4928)([^/]*$)' remote-assets.txt > owner-source-matches.txt || true
          echo '--- matches ---'
          cat owner-source-matches.txt
          echo "match_count=$(wc -l < owner-source-matches.txt)"
      - name: Upload search result
        uses: actions/upload-artifact@v4
        with:
          name: priolens-v03-owner-source-search
          path: owner-source-matches.txt
          retention-days: 7
