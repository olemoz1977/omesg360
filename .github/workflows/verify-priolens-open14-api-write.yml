name: Verify PrioLens Open14 API write path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-priolens-open14-api-write.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build deterministic synthetic payload
        shell: python
        run: |
          import json
          fams=['REST','RESOURCE','SAFETY','ORDER','CONNECTION','BELONGING','CARE','AUTONOMY','CONTROL','RECOGNITION','MASTERY','EXPLORATION','KNOWLEDGE','OPPORTUNITY']
          choices=[]
          for i in range(14):
              trio=[fams[i%14],fams[(i+4)%14],fams[(i+9)%14]]
              stimuli=[]
              for slot,f in enumerate(trio):
                  suffix='A' if (i+slot)%2==0 else 'B'
                  stimuli.append({'familyId':f,'exemplarId':f+'-'+suffix,'slot':slot})
              choices.append({
                  'trialId':f'O14-{i+1:02d}',
                  'stimuli':stimuli,
                  'choice':stimuli[0],
                  'noClearChoice':False,
                  'rtMs':100+i
              })
          payload={
              'schema':'2rasi.priolens.open14.session-v0.2',
              'sessionUuid':'00000000-0000-4000-8000-000000000001',
              'startedAt':'2026-09-01T00:00:00.000Z',
              'completedAt':'2026-09-01T00:01:00.000Z',
              'seed':'SYSTEM_SMOKE_DO_NOT_ANALYZE',
              'planSchema':'cyclic-14x3-diff-1-4-slot-role-v0.2',
              'bankSchema':'2rasi.priolens.open14.bank-v0.2',
              'assignerSchema':'balanced-open14-exemplar-assigner-v0.1',
              'choices':choices,
              'sufficiencySchema':'2rasi.priolens.sufficiency-v0.2',
              'sufficiency':{
                  'RESTORATION_ENERGY':3,
                  'MATERIAL_RESOURCES':3,
                  'SAFETY_STABILITY':3,
                  'CLARITY_PREDICTABILITY':3,
                  'CONNECTION_BELONGING':3,
                  'CARE_SUPPORT_PRESENT':3,
                  'AUTONOMY_AGENCY':3,
                  'RECOGNITION_ESTEEM':3,
                  'LEARNING_GROWTH':3,
                  'CAPABILITY_MASTERY':3,
                  'MEANING_PURPOSE':3,
                  'CONTRIBUTION':3
              }
          }
          open('/tmp/payload.json','w').write(json.dumps(payload,separators=(',',':')))
          print('payload ready')

      - name: POST to production pilot API
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 4 --retry-delay 2 -o /tmp/body -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://omesg360.eu' \
            --data-binary @/tmp/payload.json \
            'https://omesg360.eu/priolens-open14-api/api.php')"
          cat /tmp/body
          [[ "$code" == '200' ]] || { echo "Unexpected HTTP $code" >&2; exit 1; }
          grep -q '"ok":true' /tmp/body
          grep -q '"submissionId"' /tmp/body
          echo 'PASS: production API accepted deterministic synthetic session'

      - name: Health remains green
        run: |
          set -euo pipefail
          curl -fsS 'https://omesg360.eu/priolens-open14-api/health.php' | grep -q '"ok":true'
          echo 'PASS: API health remains green after write'

# The fixed SYSTEM_SMOKE_DO_NOT_ANALYZE row is infrastructure telemetry, not pilot data.
# Re-runs are idempotent because sessionUuid is fixed and unique in the table.
