name: Diagnose OMESG360 FTP read-only

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_HOST: 46.202.142.134
      FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
    steps:
      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Test FTP login and root visibility
        shell: bash
        run: |
          set -euo pipefail
          common='set ftp:ssl-allow no; set net:max-retries 1; set net:timeout 15; set cmd:fail-exit yes;'
          echo 'Testing FTP login (read-only)...'
          lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; pwd"
          echo 'Testing expected OMESG360 paths (read-only)...'
          if lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -1 /domains/omesg360.eu/public_html/index.html"; then
            echo 'ROOT_MODE=/domains/omesg360.eu/public_html'
          elif lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -1 /home/u986950573/domains/omesg360.eu/public_html/index.html"; then
            echo 'ROOT_MODE=/home/u986950573/domains/omesg360.eu/public_html'
          elif lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -1 /public_html/index.html"; then
            echo 'ROOT_MODE=/public_html'
          elif lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; cls -1 /index.html"; then
            echo 'ROOT_MODE=/'
          else
            echo 'LOGIN_OK_BUT_EXPECTED_INDEX_NOT_FOUND'
            exit 2
          fi
