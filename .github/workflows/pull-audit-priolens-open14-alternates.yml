name: Pull and Audit PrioLens Open14 Alternates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pull-audit-priolens-open14-alternates.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_GALLERY: /domains/omesg360.eu/public_html/priolens-research-assets/Gallery

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          python -m pip install --quiet pillow numpy
      - name: Pull targeted alternates
        shell: bash
        run: |
          set -euo pipefail
          OUT=priolens/gallery-review/open14-alternates-v01
          mkdir -p "$OUT"
          files=(
            '20260730_220401962.png'
            '20260730_224059303.png'
            '20260731_050331331.png'
            'file_000000006b148210abe3c22f8ce50764.png'
            '20260730_231228063.png'
            '20260811_180451129.png'
            'file_000000005de482439d67d0a9a57c0072.png'
            'S15.webp'
            'file_0000000071448246a5f5395f6a286783.png'
            'file_000000008ca882468c596d42a3e3ffce.png'
            'S07.webp'
            'file_00000000101481f48972b4f70a1ee90c.png'
          )
          common='set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; set cmd:fail-exit yes;'
          for f in "${files[@]}"; do
            echo "Pull $f"
            lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; get \"${REMOTE_GALLERY}/${f}\" -o \"${OUT}/${f}\""
            test -s "${OUT}/${f}"
          done
      - name: Compute alternate metrics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import numpy as np
          from PIL import Image, ImageFilter
          ROOT=Path('priolens/gallery-review/open14-alternates-v01')
          roles={
            '20260730_220401962.png':'CONTROL',
            '20260730_224059303.png':'CONTROL',
            '20260731_050331331.png':'CONTROL',
            'file_000000006b148210abe3c22f8ce50764.png':'CONTROL',
            '20260730_231228063.png':'KNOWLEDGE',
            '20260811_180451129.png':'KNOWLEDGE',
            'file_000000005de482439d67d0a9a57c0072.png':'KNOWLEDGE',
            'S15.webp':'OPPORTUNITY',
            'file_0000000071448246a5f5395f6a286783.png':'OPPORTUNITY',
            'file_000000008ca882468c596d42a3e3ffce.png':'OPPORTUNITY',
            'S07.webp':'RESOURCE',
            'file_00000000101481f48972b4f70a1ee90c.png':'RESOURCE',
          }
          rows=[]
          for fn,role in roles.items():
            p=ROOT/fn
            im=Image.open(p).convert('RGB')
            arr=np.asarray(im).astype(np.float32)
            g=np.asarray(im.convert('L')).astype(np.float32)
            hsv=np.asarray(im.convert('HSV')).astype(np.float32)
            e=np.asarray(im.convert('L').filter(ImageFilter.FIND_EDGES)).astype(np.float32)
            rg=arr[:,:,0]-arr[:,:,1]
            yb=.5*(arr[:,:,0]+arr[:,:,1])-arr[:,:,2]
            rows.append({
              'role':role,'file':fn,'width':im.width,'height':im.height,'aspect':round(im.width/im.height,3),
              'luminance':round(float(g.mean()),2),'contrast':round(float(g.std()),2),
              'saturation':round(float(hsv[:,:,1].mean()),2),
              'colorfulness':round(float(np.sqrt(rg.std()**2+yb.std()**2)+.3*np.sqrt(rg.mean()**2+yb.mean()**2)),2),
              'entropy':round(float(im.convert('L').entropy()),3),'edge_density':round(float((e>32).mean()),4)
            })
          out=Path('priolens/open14-audit-v01/alternate-metrics.csv')
          out.parent.mkdir(parents=True,exist_ok=True)
          with out.open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          print(out.read_text())
          PY
      - name: Commit alternates and metrics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/gallery-review/open14-alternates-v01 priolens/open14-audit-v01/alternate-metrics.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(priolens): add targeted Open14 alternate audit'
          git push origin HEAD:main
