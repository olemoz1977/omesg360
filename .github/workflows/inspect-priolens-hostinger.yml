name: Inspect PrioLens Hostinger runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-priolens-hostinger.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_BASE: /domains/omesg360.eu/public_html/priolens

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify FTP secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FTP_USER:-}" ]] || { echo 'Missing HOSTINGER_FTP_USER' >&2; exit 1; }
          [[ -n "${FTP_PASSWORD:-}" ]] || { echo 'Missing HOSTINGER_FTP_PASSWORD' >&2; exit 1; }

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Download current PrioLens files read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspect
          common='set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; set cmd:fail-exit yes;'
          lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; get \"${REMOTE_BASE}/index.html\" -o inspect/index.html"
          lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; get \"${REMOTE_BASE}/priolens_p3_standalone_v04_layout.html\" -o inspect/standalone-v04.html"
          echo 'READ-ONLY: no Hostinger file was modified.'

      - name: Exact identity check
        shell: bash
        run: |
          set -euo pipefail
          echo '--- sizes ---'
          wc -c inspect/index.html inspect/standalone-v04.html
          echo '--- sha256 ---'
          sha256sum inspect/index.html inspect/standalone-v04.html
          if cmp -s inspect/index.html inspect/standalone-v04.html; then
            echo 'EXACT_RESULT=IDENTICAL'
          else
            echo 'EXACT_RESULT=DIFFERENT'
          fi

      - name: Semantic and structural comparison
        shell: python
        run: |
          from pathlib import Path
          import re, difflib, hashlib

          a = Path('inspect/index.html').read_text(encoding='utf-8', errors='replace')
          b = Path('inspect/standalone-v04.html').read_text(encoding='utf-8', errors='replace')

          def report(label, text):
              def has(x): return x in text
              schema = re.findall(r"2rasi\.priolens\.p3\.research-v[0-9.]+", text)
              layout = re.findall(r"three-[a-z0-9-]+", text)
              print(f'[{label}] bytes={len(text.encode("utf-8"))}')
              print(f'[{label}] title_v04={has("PrioLens P3 v0.4")}')
              print(f'[{label}] schema={sorted(set(schema))}')
              print(f'[{label}] layout={sorted(set(layout))}')
              print(f'[{label}] has_14_trials={has("14 triadų") or has("14 stimulų")}')
              print(f'[{label}] has_no_clear={has("Nė vienas aiškiai")}')
              print(f'[{label}] has_exact_slot_balance={has("exact-slot-balance-v0.1")}')
              print(f'[{label}] has_PL={has("Plackett") or has("plackett") or has("PL") }')
              print(f'[{label}] has_context={has("Kontekstas")}')
              print(f'[{label}] has_pair_projection={has("Dvikovų projekcija")}')
              print(f'[{label}] embedded_images={len(re.findall(r"data:image/[^;]+;base64,", text))}')

          report('index', a)
          report('standalone-v04', b)

          # Remove huge embedded image payloads before textual diff.
          scrub = lambda s: re.sub(r'(data:image/[^;]+;base64,)[A-Za-z0-9+/=]+', r'\1<BASE64>', s)
          aa, bb = scrub(a), scrub(b)
          print('--- scrubbed textual diff (first 240 lines) ---')
          diff = list(difflib.unified_diff(
              aa.splitlines(), bb.splitlines(),
              fromfile='Hostinger index.html',
              tofile='Hostinger standalone-v04.html',
              lineterm=''
          ))
          if not diff:
              print('NO_TEXTUAL_DIFF_AFTER_BASE64_SCRUB')
          else:
              print('\n'.join(diff[:240]))
              if len(diff) > 240:
                  print(f'... DIFF_TRUNCATED total_lines={len(diff)}')
