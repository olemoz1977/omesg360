name: Apply PrioLens result experience v01

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-priolens-result-experience-v01.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply result patch
        run: python scripts/apply-priolens-result-experience-v01.py

      - name: Validate inline module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('priolens/open14-v02/index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/priolens-runtime.mjs').write_text(s[a:b])
          assert "value<=3" in s
          assert "visualOnlyCue" in s
          assert "attentionNote" in s
          PY
          node --check /tmp/priolens-runtime.mjs

      - name: Commit result experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v02/index.html
          git commit -m 'feat(priolens): turn result into focused reflection experience'
          git push origin HEAD:main
