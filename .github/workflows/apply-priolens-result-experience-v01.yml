name: Apply PrioLens result experience v01

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-priolens-result-experience-v01.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch participant result experience
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('priolens/open14-v02/index.html')
          s=p.read_text()

          old_css=".insightCue{font-size:14px;line-height:1.5;color:#666;margin-top:5px}.resultNote{font-size:14px;line-height:1.55;color:#666;margin:10px 2px 0}"
          new_css=".insightCue{font-size:14px;line-height:1.5;color:#666;margin-top:5px}.reflectionQuestion{font-size:17px;font-weight:780;line-height:1.45;margin-top:12px;color:#222}.resultNote{font-size:14px;line-height:1.55;color:#666;margin:10px 2px 0}"
          assert old_css in s
          s=s.replace(old_css,new_css,1)

          old_repeat='<div id="repeatRows" class="rows"></div>'
          new_repeat='<div id="repeatRows" class="rows"></div>\n      <p id="attentionNote" class="resultNote hidden"></p>'
          assert old_repeat in s
          s=s.replace(old_repeat,new_repeat,1)

          s=s.replace("firstHeading:'Pirmas žvilgsnis',secondLabel:'Antra perspektyva',secondHeading:'Antras atsakymas',compareLabel:'Sugretinimas'","firstHeading:'Kas patraukė tavo dėmesį',secondLabel:'Antra perspektyva',secondHeading:'Kur šiuo metu mažiau pakanka',compareLabel:'Refleksija'",1)
          s=s.replace("firstHeading:'First glance',secondLabel:'Second perspective',secondHeading:'Second answer',compareLabel:'Comparison'","firstHeading:'What pulled your attention',secondLabel:'Second perspective',secondHeading:'Where less feels sufficient right now',compareLabel:'Reflection'",1)

          start=s.index('function renderResult(){')
          end=s.index("\n$('start').onclick=",start)
          new_func=r'''function addReflection(mount,cue,question){const r=document.createElement('div');r.className='insight';r.innerHTML=`${cue?`<div class="insightCue">${cue}</div>`:''}<div class="reflectionQuestion">${question}</div>`;mount.appendChild(r)}
function renderResult(){
  const C=LANG==='en'?{
    attentionNote:'These choices show what repeatedly pulled your attention in this session. They do not tell us what you lack. Attention can be shaped by current relevance, learned value, prior experience or the image itself; a choice alone cannot tell us why it pulled you.',
    noLowTitle:'No area stood out as less sufficient right now',
    noLowCue:'The areas you rated clearly were all on the more sufficient side.',
    lowCue:(f,d)=>`${f} repeated across different images, while your current rating of the broader area “${d}” is on the less-sufficient side.`,
    midCue:(f,d)=>`${f} repeated across different images, while your current rating of the broader area “${d}” sits around the middle.`,
    highCue:(f,d)=>`${f} repeated across different images, even though you currently rate the broader area “${d}” as fairly sufficient.`,
    linkedQuestion:'Do you see a connection between these two signals, or do they feel unrelated to you?',
    highQuestion:f=>`What about the ${f.toLowerCase()} images still pulled your attention?`,
    visualOnlyCue:f=>`${f} repeated across different images. There is no equivalent current-sufficiency area that PrioLens can validly compare it with in this version.`,
    visualOnlyQuestion:f=>`What about those ${f.toLowerCase()} images may have pulled your attention?`,
    lowOnlyCue:n=>`In your second answer, ${n} stood out as less sufficient right now.`,
    lowOnlyQuestion:'Which of these areas feels most worth your attention right now?',
    quietCue:'This session did not produce a repeated visual theme, and no clearly rated area stood out as less sufficient.',
    quietQuestion:'Is there anything in this result that still surprised you?'
  }:{
    attentionNote:'Šie pasirinkimai rodo, kas šioje sesijoje pakartotinai patraukė tavo dėmesį. Jie nepasako, ko tau trūksta. Dėmesį gali veikti dabartinis aktualumas, išmokta vertė, ankstesnė patirtis ar pats vaizdas; vien iš pasirinkimo negalima pasakyti, kodėl jis patraukė.',
    noLowTitle:'Nė viena sritis neišsiskyrė kaip mažiau pakankama',
    noLowCue:'Aiškiai įvertintos sritys šiuo metu buvo labiau pakankamoje pusėje.',
    lowCue:(f,d)=>`${f} kartojosi per skirtingus vaizdus, o platesnę sritį „${d}“ šiuo metu vertini kaip mažiau pakankamą.`,
    midCue:(f,d)=>`${f} kartojosi per skirtingus vaizdus, o platesnės srities „${d}“ dabartinis įvertinimas yra per vidurį.`,
    highCue:(f,d)=>`${f} kartojosi per skirtingus vaizdus, nors platesnę sritį „${d}“ šiuo metu vertini kaip gana pakankamą.`,
    linkedQuestion:'Ar matai tarp šių dviejų signalų ryšį, ar tau jie atrodo nesusiję?',
    highQuestion:f=>`Kas ${f.toLowerCase()} vaizduose vis tiek patraukė tavo dėmesį?`,
    visualOnlyCue:f=>`${f} kartojosi per skirtingus vaizdus. Šioje PrioLens versijoje nėra lygiavertės dabartinio pakankamumo srities, su kuria tai būtų galima pagrįstai sugretinti.`,
    visualOnlyQuestion:f=>`Kas šiuose ${f.toLowerCase()} vaizduose galėjo patraukti tavo dėmesį?`,
    lowOnlyCue:n=>`Antrame atsakyme kaip mažiau pakankama šiuo metu išsiskyrė ${n}.`,
    lowOnlyQuestion:'Kuri iš šių sričių šiuo metu labiausiai verta tavo dėmesio?',
    quietCue:'Šioje sesijoje nepasikartojo viena vizualinė tema ir nė viena aiškiai įvertinta sritis neišsiskyrė kaip mažiau pakankama.',
    quietQuestion:'Ar šiame rezultate vis tiek yra kas nors, kas tave nustebino?'
  };

  const coverage=state.domainCoverage||domainCoverage();
  const rep=$('repeatRows');rep.innerHTML='';
  const repeated=Object.entries(state.familyStats).filter(([,x])=>x.chosen>=2&&x.crossExemplar).sort((a,b)=>b[1].chosen-a[1].chosen);
  if(!repeated.length)addInsight(rep,T.noRepeated,'',T.noRepeatedCue);
  else repeated.forEach(([id,x])=>addInsight(rep,FAMILY_LABEL[id],'',x.chosen===3?T.repeatEvery:T.repeatAcross));
  const attentionNote=$('attentionNote');
  if(repeated.length){attentionNote.textContent=C.attentionNote;attentionNote.classList.remove('hidden')}else{attentionNote.textContent='';attentionNote.classList.add('hidden')}

  const sr=$('suffRows');sr.innerHTML='';
  const completeDomains=DOMAINS.filter(d=>coverage[d.id].complete);
  const lowDomains=completeDomains.filter(d=>coverage[d.id].value<=3);
  const incompleteCount=DOMAINS.length-completeDomains.length;
  if(!completeDomains.length){
    addInsight(sr,T.suffNone,'',T.suffNoneCue);
  }else if(!lowDomains.length){
    addInsight(sr,C.noLowTitle,'',C.noLowCue);
  }else{
    for(const d of lowDomains){
      const v=coverage[d.id].value;
      addInsight(sr,d.title,v<=2.5?T.suffLow:T.suffMid,'');
    }
  }
  const suffNote=$('suffResultNote');
  if(incompleteCount>0&&completeDomains.length){suffNote.textContent=T.suffIncomplete(incompleteCount);suffNote.classList.remove('hidden')}else{suffNote.textContent='';suffNote.classList.add('hidden')}

  const cr=$('compareRows');cr.innerHTML='';
  const mapped=[];
  for(const d of DOMAINS){
    if(!d.families.length||!coverage[d.id].complete)continue;
    const rel=d.families.filter(f=>state.familyStats[f]?.chosen>=2&&state.familyStats[f]?.crossExemplar);
    if(!rel.length)continue;
    mapped.push({domain:d,rel,value:coverage[d.id].value,maxChosen:Math.max(...rel.map(f=>state.familyStats[f].chosen))});
  }
  mapped.sort((a,b)=>((a.value<=3?0:1)-(b.value<=3?0:1))||(b.maxChosen-a.maxChosen));

  if(mapped.length){
    const m=mapped[0],famNames=joinNatural(m.rel.map(f=>FAMILY_LABEL[f]));
    const cue=m.value<=2.5?C.lowCue(famNames,m.domain.title):m.value<=3?C.midCue(famNames,m.domain.title):C.highCue(famNames,m.domain.title);
    const question=m.value<=3?C.linkedQuestion:C.highQuestion(famNames);
    addReflection(cr,cue,question);
  }else if(repeated.length){
    const name=FAMILY_LABEL[repeated[0][0]];
    addReflection(cr,C.visualOnlyCue(name),C.visualOnlyQuestion(name));
  }else if(lowDomains.length){
    const names=joinNatural(lowDomains.map(d=>d.title));
    addReflection(cr,C.lowOnlyCue(names),C.lowOnlyQuestion);
  }else{
    addReflection(cr,C.quietCue,C.quietQuestion);
  }

  $('debug').textContent=JSON.stringify(state,null,2)
}'''
          s=s[:start]+new_func+s[end:]

          for needle in [
            "firstHeading:'Kas patraukė tavo dėmesį'",
            "secondHeading:'Kur šiuo metu mažiau pakanka'",
            "compareLabel:'Refleksija'",
            "firstHeading:'What pulled your attention'",
            "secondHeading:'Where less feels sufficient right now'",
            "const lowDomains=completeDomains.filter(d=>coverage[d.id].value<=3)",
            "They do not tell us what you lack",
            "Jie nepasako, ko tau trūksta",
            "Ar matai tarp šių dviejų signalų ryšį",
            "Do you see a connection between these two signals",
            "visualOnlyCue"
          ]:
            assert needle in s, needle

          p.write_text(s)
          PY

      - name: Validate inline module syntax and result guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('priolens/open14-v02/index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/priolens-runtime.mjs').write_text(s[a:b])
          assert "value<=3" in s
          assert "visualOnlyCue" in s
          assert "attentionNote" in s
          print('PASS: result experience guards present')
          PY
          node --check /tmp/priolens-runtime.mjs

      - name: Commit result experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v02/index.html
          git commit -m 'feat(priolens): turn result into focused reflection experience'
          git push origin HEAD:main
