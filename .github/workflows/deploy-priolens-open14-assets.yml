name: Deploy PrioLens Open14 pilot assets

on:
  push:
    branches: [main]
    paths:
      - priolens/open14-v02/assets/**
      - .github/workflows/deploy-priolens-open14-assets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omesg360-priolens-open14-assets
  cancel-in-progress: false

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-research-assets/Open14-v02

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate local assets
        shell: bash
        run: |
          set -euo pipefail
          files=(
            priolens/open14-v02/assets/priolens_care-a_v01.webp
            priolens/open14-v02/assets/priolens_care-b_v01.webp
            priolens/open14-v02/assets/priolens_recognition-a_v01.webp
            priolens/open14-v02/assets/priolens_recognition-b_v01.webp
          )
          for f in "${files[@]}"; do
            test -s "$f"
            file "$f" | grep -q 'Web/P image'
          done
          echo 'PASS: four approved Open14 WebP assets present'

      - name: Verify FTP secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FTP_USER:-}" ]] || { echo 'Missing HOSTINGER_FTP_USER' >&2; exit 1; }
          [[ -n "${FTP_PASSWORD:-}" ]] || { echo 'Missing HOSTINGER_FTP_PASSWORD' >&2; exit 1; }

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload four assets without delete
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; set cmd:fail-exit no; mkdir -p \"$REMOTE_DIR\"; set cmd:fail-exit yes; put -O \"$REMOTE_DIR/\" priolens/open14-v02/assets/priolens_care-a_v01.webp; put -O \"$REMOTE_DIR/\" priolens/open14-v02/assets/priolens_care-b_v01.webp; put -O \"$REMOTE_DIR/\" priolens/open14-v02/assets/priolens_recognition-a_v01.webp; put -O \"$REMOTE_DIR/\" priolens/open14-v02/assets/priolens_recognition-b_v01.webp"
          echo 'Uploaded four Open14 pilot assets only; no delete operation used.'

      - name: HTTP smoke all four assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://omesg360.eu/priolens-research-assets/Open14-v02'
          for f in priolens_care-a_v01.webp priolens_care-b_v01.webp priolens_recognition-a_v01.webp priolens_recognition-b_v01.webp; do
            curl -fsS --retry 4 --retry-delay 2 -o /dev/null "$base/$f"
          done
          echo 'PASS: four Open14 pilot assets reachable'

# Research assets stay outside deploy-owned /priolens and /priolens-open14-v02 runtime routes.
