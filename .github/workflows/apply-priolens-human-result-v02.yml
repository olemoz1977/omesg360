name: Apply PrioLens human result v02

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-priolens-human-result-v02.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply human result patch
        shell: bash
        run: |
          set -euo pipefail
          sed -i "/'2 iš 3 kartų',/d" scripts/apply-priolens-human-result-v02.py
          python scripts/apply-priolens-human-result-v02.py

      - name: Validate inline module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('priolens/open14-v02/index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/priolens-runtime.mjs').write_text(s[a:b])
          for needle in ['choiceVisuals','reflectionHero','FAMILY_MEANINGS','Ką rinkaisi dažniausiai','Kas čia verta antro žvilgsnio?']:
              assert needle in s, needle
          PY
          node --check /tmp/priolens-runtime.mjs

      - name: Commit human result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-v02/index.html
          git commit -m 'feat(priolens): make result visual human and reflection-led'
          git push origin HEAD:main
