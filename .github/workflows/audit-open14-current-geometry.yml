name: Audit current Open14 geometry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-open14-current-geometry.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  ROOT: /domains/omesg360.eu/public_html/priolens-research-assets

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - run: python -m pip install --quiet pillow
      - name: Pull current bank assets and report dimensions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/open14-geometry
          python - <<'PY' > /tmp/asset-map.tsv
          import json
          b=json.load(open('priolens/open14-v02/bank.json'))
          for family,fam in b['families'].items():
              for ex in fam['exemplars']:
                  rel=ex['runtimePath'].split('/priolens-research-assets/',1)[1]
                  print(f"{family}\t{ex['id']}\t{rel}")
          PY
          while IFS=$'\t' read -r family ex rel; do
            safe="${family}__${ex}__$(basename "$rel")"
            lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST; get \"$ROOT/$rel\" -o \"/tmp/open14-geometry/$safe\""
          done < /tmp/asset-map.tsv
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          rows=[]
          for p in sorted(Path('/tmp/open14-geometry').iterdir()):
              parts=p.name.split('__',2)
              family, exemplar, filename=parts
              with Image.open(p) as im:
                  w,h=im.size
              aspect=w/h
              if abs(aspect-1.0) <= 0.03:
                  shape='SQUARE'
              elif aspect < 1:
                  shape='PORTRAIT'
              else:
                  shape='LANDSCAPE'
              rows.append((family,exemplar,filename,w,h,aspect,shape))
          print('family\texemplar\tfile\twidth\theight\taspect\tshape')
          for r in rows:
              print(f'{r[0]}\t{r[1]}\t{r[2]}\t{r[3]}\t{r[4]}\t{r[5]:.3f}\t{r[6]}')
          non=[r for r in rows if r[6] != 'SQUARE']
          print(f'\nTOTAL={len(rows)} SQUARE={len(rows)-len(non)} NON_SQUARE={len(non)}')
          print('NON_SQUARE_LIST')
          for r in non:
              print(f'{r[0]}\t{r[1]}\t{r[2]}\t{r[3]}x{r[4]}\t{r[5]:.3f}\t{r[6]}')
          assert len(rows)==28, len(rows)
          PY
