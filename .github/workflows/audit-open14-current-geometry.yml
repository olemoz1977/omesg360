name: Audit current Open14 geometry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-open14-current-geometry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow
      - name: Download current bank assets and report dimensions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/open14-geometry
          python - <<'PY' > /tmp/asset-map.tsv
          import json
          b=json.load(open('priolens/open14-v02/bank.json'))
          for family,fam in b['families'].items():
              for ex in fam['exemplars']:
                  print(f"{family}\t{ex['id']}\t{ex['runtimePath']}")
          PY
          while IFS=$'\t' read -r family ex path; do
            out="/tmp/open14-geometry/${family}__${ex}__$(basename "$path")"
            url="https://omesg360.eu${path}"
            echo "GET $family $ex $url"
            curl -fL --retry 5 --retry-all-errors --retry-delay 2 -A 'Mozilla/5.0' -e 'https://omesg360.eu/priolens-open14-v02/' "$url" -o "$out"
            sleep 1
          done < /tmp/asset-map.tsv
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          rows=[]
          for p in sorted(Path('/tmp/open14-geometry').iterdir()):
              family, exemplar, filename=p.name.split('__',2)
              with Image.open(p) as im:
                  w,h=im.size
              aspect=w/h
              shape='SQUARE' if abs(aspect-1)<=0.03 else ('PORTRAIT' if aspect<1 else 'LANDSCAPE')
              rows.append((family,exemplar,filename,w,h,aspect,shape))
          print('family\texemplar\tfile\twidth\theight\taspect\tshape')
          for r in rows:
              print(f'{r[0]}\t{r[1]}\t{r[2]}\t{r[3]}\t{r[4]}\t{r[5]:.3f}\t{r[6]}')
          non=[r for r in rows if r[6]!='SQUARE']
          print(f'\nTOTAL={len(rows)} SQUARE={len(rows)-len(non)} NON_SQUARE={len(non)}')
          print('NON_SQUARE_LIST')
          for r in non:
              print(f'{r[0]}\t{r[1]}\t{r[2]}\t{r[3]}x{r[4]}\t{r[5]:.3f}\t{r[6]}')
          assert len(rows)==28
          PY
