name: Deploy PrioLens recovered research assets

on:
  push:
    branches: [main]
    paths:
      - priolens/recovered-assets/**
      - .github/workflows/deploy-priolens-recovered-assets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omesg360-priolens-recovered-assets
  cancel-in-progress: false

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-research-assets/Recovered

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate local recovered assets
        shell: bash
        run: |
          set -euo pipefail
          test -s priolens/recovered-assets/priolens_aut_backpack_v01.webp
          test -s priolens/recovered-assets/priolens_aut_control_audio_boundary_v01.webp
          file priolens/recovered-assets/*.webp | grep -q 'Web/P image'
          echo 'PASS: recovered WebP assets present'

      - name: Verify FTP secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FTP_USER:-}" ]] || { echo 'Missing HOSTINGER_FTP_USER' >&2; exit 1; }
          [[ -n "${FTP_PASSWORD:-}" ]] || { echo 'Missing HOSTINGER_FTP_PASSWORD' >&2; exit 1; }

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload recovered assets without delete
        shell: bash
        run: |
          set -euo pipefail
          common='set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; set cmd:fail-exit yes;'
          lftp -c "$common open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; mkdir -p \"$REMOTE_DIR\"; put -O \"$REMOTE_DIR/\" priolens/recovered-assets/priolens_aut_backpack_v01.webp; put -O \"$REMOTE_DIR/\" priolens/recovered-assets/priolens_aut_control_audio_boundary_v01.webp"
          echo 'Uploaded recovered assets only; no delete/mirror operation used.'

      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 -o /dev/null 'https://omesg360.eu/priolens-research-assets/Recovered/priolens_aut_backpack_v01.webp'
          curl -fsS --retry 4 --retry-delay 2 -o /dev/null 'https://omesg360.eu/priolens-research-assets/Recovered/priolens_aut_control_audio_boundary_v01.webp'
          echo 'PASS: recovered research assets reachable'
