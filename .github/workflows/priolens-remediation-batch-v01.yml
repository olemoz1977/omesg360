name: PrioLens remediation batch v01

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/priolens-remediation-batch-v01.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      GALLERY: /domains/omesg360.eu/public_html/priolens-research-assets/Gallery
      OUT: /domains/omesg360.eu/public_html/priolens-research-assets/Open14-remediation-v01
      REVIEW: /domains/omesg360.eu/public_html/priolens-remediation-review-v01
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp tesseract-ocr
          python -m pip install --quiet pillow ImageHash opencv-python-headless

      - name: Download source assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/src /tmp/out /tmp/review
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; \
            get \"$GALLERY/20260829_233727670.png\" -o /tmp/src/safety-current.png; \
            get \"$GALLERY/S13.webp\" -o /tmp/src/safety-s13.webp; \
            get \"$GALLERY/file_00000000cc8c81f4a927534c8316290c.png\" -o /tmp/src/autonomy-a.png; \
            get \"$GALLERY/20260730_233524155.png\" -o /tmp/src/rest-a.png; \
            get \"$GALLERY/20260730_233054250.png\" -o /tmp/src/knowledge-a.png; \
            get \"$GALLERY/S03.webp\" -o /tmp/src/connection-a.webp; \
            get \"$GALLERY/20260829_235204397.png\" -o /tmp/src/connection-b.png"

      - name: Audit, normalize and prepare cleanup review
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import imagehash, subprocess, json, cv2, numpy as np

          src=Path('/tmp/src'); out=Path('/tmp/out'); review=Path('/tmp/review')
          out.mkdir(exist_ok=True); review.mkdir(exist_ok=True)
          keywords=('kling','kiing','gemini','openai','watermark')

          def ocr(path):
              try:
                  p=subprocess.run(['tesseract',str(path),'stdout','--psm','11'],capture_output=True,text=True,timeout=30)
                  return ' '.join(p.stdout.lower().split())
              except Exception:
                  return ''

          def audit(path):
              with Image.open(path) as im:
                  size=im.size
              text=ocr(path)
              return {'size':size,'ocr':text,'watermark_keyword':any(k in text for k in keywords)}

          # SAFETY-B exact perceptual duplicate check.
          with Image.open(src/'safety-current.png') as a, Image.open(src/'safety-s13.webp') as b:
              safety_dist=int(imagehash.phash(a.convert('RGB'))-imagehash.phash(b.convert('RGB')))
          safety=audit(src/'safety-s13.webp')
          safety['phashDistanceToCurrent']=safety_dist
          safety['switchReady']=(safety_dist==0 and not safety['watermark_keyword'])

          # AUTONOMY-A accepted candidate: switch only if square and no detected watermark keyword.
          autonomy=audit(src/'autonomy-a.png')
          autonomy['switchReady']=(autonomy['size'][0]==autonomy['size'][1] and not autonomy['watermark_keyword'])

          # Portrait candidate crop variants, originals untouched.
          crops={}
          for key,fn in [('rest-a','rest-a.png'),('knowledge-a','knowledge-a.png')]:
              im=Image.open(src/fn).convert('RGB')
              w,h=im.size; side=min(w,h)
              xs=(w-side)//2
              ys={'top':0,'center':(h-side)//2,'bottom':h-side} if h>=w else {'top':(w-side)//2,'center':(w-side)//2,'bottom':(w-side)//2}
              rows=[]
              for pos in ['top','center','bottom']:
                  if h>=w:
                      box=(xs,ys[pos],xs+side,ys[pos]+side)
                  else:
                      x={'top':0,'center':(w-side)//2,'bottom':w-side}[pos]
                      box=(x,0,x+side,side)
                  c=im.crop(box).resize((640,640),Image.Resampling.LANCZOS)
                  name=f'{key}_sq_{pos}_v01.webp'
                  c.save(out/name,'WEBP',quality=88,method=6)
                  rows.append(name)
              crops[key]={'sourceSize':[w,h],'variants':rows,'sourceOcr':ocr(src/fn)}

          # CONNECTION watermark cleanup candidates. We intentionally do not switch bank here.
          cleanup={}
          for key,fn in [('connection-a','connection-a.webp'),('connection-b','connection-b.png')]:
              img=cv2.imread(str(src/fn),cv2.IMREAD_COLOR)
              if img is None: raise RuntimeError(f'cannot read {fn}')
              h,w=img.shape[:2]
              variants=[]
              for label,x0,y0 in [('small',0.78,0.88),('medium',0.70,0.84)]:
                  mask=np.zeros((h,w),np.uint8)
                  cv2.rectangle(mask,(int(w*x0),int(h*y0)),(w-1,h-1),255,-1)
                  clean=cv2.inpaint(img,mask,5,cv2.INPAINT_TELEA)
                  name=f'{key}_clean_{label}_v01.webp'
                  cv2.imwrite(str(out/name),clean,[cv2.IMWRITE_WEBP_QUALITY,90])
                  variants.append({'name':name,'ocr':ocr(out/name)})
              cleanup[key]={'sourceOcr':ocr(src/fn),'variants':variants}

          report={'safety':safety,'autonomy':autonomy,'crops':crops,'cleanup':cleanup}
          Path('/tmp/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))

          # Human review page.
          def url(name): return '/priolens-research-assets/Open14-remediation-v01/'+name
          html=['<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrioLens remediation review</title><style>body{font-family:system-ui;background:#111;color:#eee;margin:0;padding:18px}h1{font-size:22px}.sec{margin:28px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:#1d1d1d;border:1px solid #333;border-radius:12px;padding:8px}.card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#000;border-radius:8px}.tag{font-size:13px;color:#bbb;margin-top:6px}.orig{border-color:#754}.ok{border-color:#476}</style></head><body><h1>PrioLens · remediation review v01</h1>']
          for title,key in [('REST-A · šlepetės','rest-a'),('KNOWLEDGE-A · biblioteka','knowledge-a')]:
              html.append(f'<div class="sec"><h2>{title}</h2><div class="grid">')
              for n in crops[key]['variants']:
                  label=n.split('_sq_')[1].split('_v01')[0]
                  html.append(f'<div class="card"><img src="{url(n)}"><div class="tag">{label}</div></div>')
              html.append('</div></div>')
          for title,key,origurl in [('CONNECTION-A · watermark cleanup','connection-a','/priolens-research-assets/Gallery/S03.webp'),('CONNECTION-B · watermark cleanup','connection-b','/priolens-research-assets/Gallery/20260829_235204397.png')]:
              html.append(f'<div class="sec"><h2>{title}</h2><div class="grid"><div class="card orig"><img src="{origurl}"><div class="tag">original</div></div>')
              for v in cleanup[key]['variants']:
                  label='small mask' if '_small_' in v['name'] else 'medium mask'
                  html.append(f'<div class="card"><img src="{url(v["name"])}"><div class="tag">{label}</div></div>')
              html.append('</div></div>')
          html.append('</body></html>')
          (review/'index.html').write_text(''.join(html),encoding='utf-8')
          PY

      - name: Patch bank for machine-verifiable ready switches
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.load(open('/tmp/report.json'))
          p=Path('priolens/open14-v02/bank.json')
          bank=json.loads(p.read_text(encoding='utf-8'))
          changed=[]
          if report['safety']['switchReady']:
              ex=bank['families']['SAFETY']['exemplars'][1]
              ex['sourceRuntimePath']=ex['runtimePath']
              ex['runtimePath']='/priolens-research-assets/Gallery/S13.webp'
              ex['visualStatus']='CLEAN_EQUIVALENT_PHASH0'
              ex['risk']='clean Gallery equivalent selected after pHash=0 comparison; no watermark keyword detected in OCR pass'
              changed.append('SAFETY-B')
          if report['autonomy']['switchReady']:
              ex=bank['families']['AUTONOMY']['exemplars'][0]
              ex['sourceRuntimePath']=ex['runtimePath']
              ex['runtimePath']='/priolens-research-assets/Gallery/file_00000000cc8c81f4a927534c8316290c.png'
              ex.pop('semanticStatus',None)
              ex['status']='OWNER_ACCEPTED_CANDIDATE_SWITCHED'
              ex['firstImpulse']='pasirinkti savo kryptį'
              ex['risk']='forked-path candidate selected for self-direction; continue to treat as formative stimulus pending external data'
              changed.append('AUTONOMY-A')
          p.write_text(json.dumps(bank,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('BANK_SWITCHES=',','.join(changed) if changed else '<none>')
          PY
          git config user.name 'olemoz1977'
          git config user.email 'olemoz1977@gmail.com'
          if ! git diff --quiet -- priolens/open14-v02/bank.json; then
            git add priolens/open14-v02/bank.json
            git commit -m 'fix(priolens): switch verified Safety and Autonomy candidates'
            git push
          fi

      - name: Deploy remediation derivatives and review page
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; mkdir -p \"$OUT\"; mirror -R --parallel=4 /tmp/out \"$OUT\"; mkdir -p \"$REVIEW\"; mirror -R /tmp/review \"$REVIEW\""

      - name: Smoke review page and switched assets
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3 https://omesg360.eu/priolens-remediation-review-v01/ | grep -q 'remediation review v01'
          curl -fsSI --retry 5 --retry-delay 3 https://omesg360.eu/priolens-research-assets/Open14-remediation-v01/rest-a_sq_center_v01.webp | grep -qi '200'
          curl -fsSI --retry 5 --retry-delay 3 https://omesg360.eu/priolens-research-assets/Gallery/S13.webp | grep -qi '200'
