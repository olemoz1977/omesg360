name: PrioLens bank v0.4 isolated asset QC

on:
  workflow_dispatch:
  push:
    branches:
      - feature/priolens-v04-bank-v04
    paths:
      - '.github/workflows/priolens-v04-bank-v04-qc.yml'
      - 'priolens/open14-v04/build_from_v031.mjs'
      - 'priolens/open14-v04/assets-v04-source-b64/**'
      - 'priolens-research-assets/Open14-v04/**'

permissions:
  contents: read

concurrency:
  group: priolens-v04-bank-v04-qc
  cancel-in-progress: true

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  ASSET_REMOTE: /domains/omesg360.eu/public_html/priolens-research-assets/Open14-v04
  ASSET_PUBLIC: https://omesg360.eu/priolens-research-assets/Open14-v04
  REVIEW_REMOTE: /domains/omesg360.eu/public_html/priolens-research-assets/Open14-v04-bank-review-v01
  REVIEW_PUBLIC: https://omesg360.eu/priolens-research-assets/Open14-v04-bank-review-v01
  CURRENT_PUBLIC: https://omesg360.eu

jobs:
  stage-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-v04-bank-v04

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install image and FTP tools
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp >/dev/null

      - name: Build bank v0.4 candidate
        run: |
          set -euo pipefail
          node priolens/open14-v04/build_from_v031.mjs
          python - <<'PY'
          import json
          p='priolens/open14-v04/bank.json'
          b=json.load(open(p,encoding='utf-8'))
          assert b['schema']=='2rasi.priolens.open14.bank-v0.4'
          assert b['runtimeReady'] is True
          assert b['status']=='V04_BANK_READY_FOR_PROMOTION'
          rows=[x for fam in b['families'].values() for x in fam['exemplars']]
          assert len(rows)==42
          assert len({x['id'] for x in rows})==42
          assert len({x['runtimePath'] for x in rows})==42
          o=b['families']['OPPORTUNITY']
          roles=o['exemplarMechanisms']
          assert roles['OPPORTUNITY-01']=='OCCUPY_OPENING'
          assert roles['OPPORTUNITY-02']=='CREATE_FROM_AVAILABLE_START'
          assert roles['OPPORTUNITY-03']=='JOIN_AVAILABLE_PLACE'
          print('PASS bank v0.4 candidate structure')
          PY

      - name: Prepare five changed assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v04-src /tmp/v04-assets

          decode_parts() {
            local stem="$1"
            local out="$2"
            cat priolens/open14-v04/assets-v04-source-b64/"$stem".b64.part* \
              | tr -d '[:space:]' \
              | base64 -d > "/tmp/v04-assets/$out"
          }
          decode_parts opportunity_01_parking_640.webp opportunity_01_parking_640.webp
          decode_parts opportunity_03_meeting_seat_640.webp opportunity_03_meeting_seat_640.webp
          decode_parts autonomy_02_backpack_clean_640.webp autonomy_02_backpack_clean_640.webp

          curl -fsSL --retry 4 --retry-delay 2             "https://images.pexels.com/photos/14526291/pexels-photo-14526291.jpeg"             -o /tmp/v04-src/safety_14526291.jpg
          curl -fsSL --retry 4 --retry-delay 2             "https://images.pexels.com/photos/12912014/pexels-photo-12912014.jpeg"             -o /tmp/v04-src/exploration_12912014.jpg

          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import hashlib, json

          R=Image.Resampling.LANCZOS
          out=Path('/tmp/v04-assets')
          for src,name in [
            ('/tmp/v04-src/safety_14526291.jpg','safety_02_protective_case_640.webp'),
            ('/tmp/v04-src/exploration_12912014.jpg','exploration_01_drawer_search_640.webp'),
          ]:
              im=Image.open(src).convert('RGB')
              im=ImageOps.fit(im,(640,640),method=R,centering=(0.5,0.5))
              im.save(out/name,'WEBP',quality=92,method=6)

          expected_raw={
            'safety_02_protective_case_640.webp':'92ec9f938208923d535d1b8d2217852cf4c904c04ab9454ee0ad8ad367291ed9',
            'exploration_01_drawer_search_640.webp':'9137ff2414d909e5c69470d0a5377a42b9886ca7d6e397dd3062c710cf65051d',
            'opportunity_01_parking_640.webp':'ff9eda0e5af4cc09b1001e72195a590e390bbae618dbc62e1b6bf6f7d8f19298',
            'opportunity_03_meeting_seat_640.webp':'d0793f7a88bfbd43375c7f4c59dce6bd63d622952777c50b6c794fe32e8f92c6',
            'autonomy_02_backpack_clean_640.webp':'29cf9f4a42268ab99a308b68a2ced47031b3d5f51441da676b03881430a36fad',
          }
          expected_pixels={
            'safety_02_protective_case_640.webp':'f3339c0d6f03dfc38557f1f8beee4aac7ecde85ee84b09abc3fe187760496832',
            'exploration_01_drawer_search_640.webp':'411457a99f87ca4c8dedbe96d062e34125b1bfa6425c3f8754fd42f20ad32adb',
            'opportunity_01_parking_640.webp':'e793a5c62039bafe2bb4a13cc4ee018804928da62ac7ecb801e03e21b13bcef8',
            'opportunity_03_meeting_seat_640.webp':'6089531a4737636253992d7fe4173013be35a714f3eb209052478c4f3ebe4865',
            'autonomy_02_backpack_clean_640.webp':'387d422372cc4f796de23b5fc6846a358d1f92af7ef8e52c865f3bcf0d67d43c',
          }
          manifest={}
          for p in sorted(out.iterdir()):
              data=p.read_bytes()
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', (p.name, data[:12])
              sha=hashlib.sha256(data).hexdigest()
              im=Image.open(p).convert('RGB')
              assert im.size==(640,640), (p.name,im.size)
              pixel_sha=hashlib.sha256(im.tobytes()).hexdigest()
              if p.name in expected_raw:
                  assert sha==expected_raw[p.name], (p.name,sha,expected_raw[p.name])
              if p.name in expected_pixels:
                  assert pixel_sha==expected_pixels[p.name], (p.name,pixel_sha,expected_pixels[p.name])
              manifest[p.name]={
                  'sha256':sha,
                  'pixelSha256':pixel_sha,
                  'bytes':len(data),
                  'size':[640,640],
              }
          Path('/tmp/v04-asset-manifest.json').write_text(
              json.dumps({
                  'schema':'2rasi.priolens.open14.bank-v0.4.asset-qc-v0.1',
                  'bankSchema':'2rasi.priolens.open14.bank-v0.4',
                  'assets':manifest,
                  'stockSources':{
                    'safety_02_protective_case_640.webp':'Pexels 14526291',
                    'exploration_01_drawer_search_640.webp':'Pexels 12912014',
                  }
              },indent=2),
              encoding='utf-8'
          )
          print(Path('/tmp/v04-asset-manifest.json').read_text())
          PY

      - name: Upload isolated bank v0.4 asset namespace
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; mkdir -p \"$ASSET_REMOTE\"; mirror -R --delete --parallel=1 /tmp/v04-assets/ \"$ASSET_REMOTE/\"; put -O \"$ASSET_REMOTE/\" /tmp/v04-asset-manifest.json"

      - name: Verify changed remote assets byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v04-remote
          for f in             safety_02_protective_case_640.webp             exploration_01_drawer_search_640.webp             autonomy_02_backpack_clean_640.webp             opportunity_01_parking_640.webp             opportunity_03_meeting_seat_640.webp; do
            curl -fsSL --retry 4 -H 'Cache-Control: no-cache' "$ASSET_PUBLIC/$f?sha=$GITHUB_SHA" -o "/tmp/v04-remote/$f"
            cmp "/tmp/v04-assets/$f" "/tmp/v04-remote/$f"
            python - "$f" <<'PY'
          import sys
          from PIL import Image
          p='/tmp/v04-remote/'+sys.argv[1]
          im=Image.open(p)
          assert im.size==(640,640)
          print('BYTE/SIZE PASS',sys.argv[1])
          PY
          done

      - name: Record technical QC evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          p='priolens/open14-v04/bank.json'
          b=json.load(open(p,encoding='utf-8'))
          assert b['status']=='V04_BANK_READY_FOR_PROMOTION'
          assert b['runtimeReady'] is True
          assert b.get('ownerVisualReview',{}).get('status')=='PASS'
          gate=b.setdefault('deploymentGate',{})
          gate['bankV04ChangedAssetTechnicalQcPassed']=True
          gate['bankV04ChangedAssetTechnicalQcRunId']=int(os.environ['GITHUB_RUN_ID'])
          gate['bankV04ChangedAssetTechnicalQcCommit']=os.environ['GITHUB_SHA']
          gate['owner42VisualReviewPassed']=True
          open(p,'w',encoding='utf-8').write(json.dumps(b,indent=2,ensure_ascii=False)+'\n')
          print('PASS bank v0.4 promotion-ready; active participant runtime still untouched')
          PY

      - name: Build exact 42-image owner review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v04-review/img
          cp /tmp/v04-asset-manifest.json /tmp/v04-review/CHANGED_ASSET_MANIFEST.json
          cp priolens/open14-v04/bank.json /tmp/v04-review/BANK_V04_CANDIDATE.json

          python - <<'PY'
          import json, subprocess, html, hashlib
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont

          bank=json.load(open('priolens/open14-v04/bank.json',encoding='utf-8'))
          root=Path('/tmp/v04-review')
          imgdir=root/'img'
          cards=[]
          rows=[]
          new_prefix='/priolens-research-assets/Open14-v04/'
          base='https://omesg360.eu'

          for family,fam in bank['families'].items():
              for ex in fam['exemplars']:
                  eid=ex['id']; rp=ex['runtimePath']
                  url=base+rp
                  dst=imgdir/(eid+'.'+rp.rsplit('.',1)[-1].split('?')[0])
                  subprocess.run(['curl','-fsSL','--retry','4',url,'-o',str(dst)],check=True)
                  data=dst.read_bytes()
                  im=Image.open(dst)
                  rows.append((family,eid,rp,dst,im.size,hashlib.sha256(data).hexdigest()))
                  badge='CHANGED v0.4' if rp.startswith(new_prefix) else 'UNCHANGED'
                  role=ex.get('mechanismRole','')
                  cards.append(
                      f'<article class="card"><div class="pic"><img src="{html.escape(url)}" alt=""></div>'
                      f'<div class="meta"><b>{html.escape(eid)}</b><span class="badge">{badge}</span>'
                      + (f'<span>{html.escape(role)}</span>' if role else '')
                      + f'<small>{html.escape(rp)}</small></div></article>'
                  )

          assert len(rows)==42

          R=Image.Resampling.LANCZOS
          tw,th=240,290
          cols=3
          sheet=Image.new('RGB',(cols*tw,14*th),(238,241,239))
          font=ImageFont.load_default()
          for i,(family,eid,rp,dst,size,sha) in enumerate(rows):
              im=Image.open(dst).convert('RGB')
              thumb=ImageOps.fit(im,(220,220),method=R,centering=(0.5,0.5))
              tile=Image.new('RGB',(tw,th),'white')
              tile.paste(thumb,(10,10))
              d=ImageDraw.Draw(tile)
              d.text((10,238),eid,fill='black',font=font)
              d.text((10,254),family,fill=(70,70,70),font=font)
              d.text((10,270),sha[:14],fill=(100,100,100),font=font)
              sheet.paste(tile,((i%cols)*tw,(i//cols)*th))
          sheet.save(root/'contact-sheet-42.jpg',quality=92)

          page='''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>PrioLens bank v0.4 owner review</title>
          <style>
          body{margin:0;background:#eef2ef;color:#17231f;font:15px/1.4 system-ui}.w{max-width:1050px;margin:auto;padding:18px}
          h1{font-family:Georgia,serif}.note{background:white;border:1px solid #d5dfda;border-radius:14px;padding:14px;margin:12px 0}
          .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #d5dfda;border-radius:14px;overflow:hidden}
          .pic{aspect-ratio:1;background:#ddd}.pic img{width:100%;height:100%;object-fit:cover;display:block}.meta{padding:10px;display:grid;gap:4px}.meta small{overflow-wrap:anywhere;color:#667}
          .badge{font-size:11px;font-weight:700;color:#53635c}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.w{padding:10px}.meta small{font-size:10px}}
          </style></head><body><main class="w">
          <h1>PrioLens · bank v0.4 candidate</h1>
          <div class="note"><b>Owner review only.</b> Active participant runtime has not been switched. Review all 42 images, with special attention to the five marked CHANGED v0.4.</div>
          <div class="note">Opportunity mechanism: narrow construct, broad surface representation. O1=OCCUPY, O2=CREATE, O3=JOIN.</div>
          <p><a href="contact-sheet-42.jpg">Open 42-image contact sheet</a> · <a href="BANK_V04_CANDIDATE.json">bank manifest</a> · <a href="CHANGED_ASSET_MANIFEST.json">changed asset hashes</a></p>
          <section class="grid">'''+''.join(cards)+'''</section></main></body></html>'''
          (root/'index.html').write_text(page,encoding='utf-8')
          PY

      - name: Upload isolated owner review
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; mkdir -p \"$REVIEW_REMOTE\"; mirror -R --delete --parallel=1 /tmp/v04-review/ \"$REVIEW_REMOTE/\""

      - name: Verify review
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 "$REVIEW_PUBLIC/index.html?sha=$GITHUB_SHA" -o /tmp/review-index.html
          grep -Fq 'bank v0.4 candidate' /tmp/review-index.html
          curl -fsSL --retry 4 "$REVIEW_PUBLIC/contact-sheet-42.jpg?sha=$GITHUB_SHA" -o /tmp/review-contact-sheet-42.jpg
          test -s /tmp/review-contact-sheet-42.jpg
          curl -fsSL --retry 4 "$REVIEW_PUBLIC/BANK_V04_CANDIDATE.json?sha=$GITHUB_SHA" -o /tmp/review-bank-v04.json
          grep -Fq '2rasi.priolens.open14.bank-v0.4' /tmp/review-bank-v04.json
          grep -Fq 'V04_BANK_READY_FOR_PROMOTION' /tmp/review-bank-v04.json
          echo "REVIEW_URL=$REVIEW_PUBLIC/"
          echo 'PASS: bank v0.4 promotion-ready after owner review; active participant runtime untouched'

      - uses: actions/upload-artifact@v4
        with:
          name: priolens-bank-v04-qc-review
          path: |
            /tmp/v04-review/
            /tmp/v04-asset-manifest.json
          retention-days: 30
