name: One-shot fix Rank v0.2 unanswered slider

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-fix-rank-v02-unanswered-slider.yml

permissions:
  contents: write

env:
  FTP_HOST: 46.202.142.134
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  REMOTE_DIR: /domains/omesg360.eu/public_html/priolens-open14-rank-v02

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch unanswered slider visual state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('priolens/open14-rank-v02/index.html')
          s=p.read_text()
          old='.rangeBox input{width:100%;min-height:34px;accent-color:#181818}.rangeBox input.noValue::-webkit-slider-thumb{opacity:0}.rangeBox input.noValue::-moz-range-thumb{opacity:0}'
          new='.rangeBox input{width:100%;min-height:34px;accent-color:#181818}.rangeBox input.noValue{-webkit-appearance:none;appearance:none;background:transparent;accent-color:#d9d9d3}.rangeBox input.noValue::-webkit-slider-runnable-track{height:4px;background:#d9d9d3;border-radius:99px}.rangeBox input.noValue::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:0;height:0;opacity:0}.rangeBox input.noValue::-moz-range-track{height:4px;background:#d9d9d3;border-radius:99px}.rangeBox input.noValue::-moz-range-progress{height:4px;background:#d9d9d3}.rangeBox input.noValue::-moz-range-thumb{opacity:0}'
          if old not in s:
              raise SystemExit('expected old slider CSS not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          assert 'input.noValue{-webkit-appearance:none' in s
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/rank-v02.mjs').write_text(s[a:b])
          print('slider patch applied')
          PY
          node --check /tmp/rank-v02.mjs

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priolens/open14-rank-v02/index.html
          git commit -m 'Fix Rank v0.2 unanswered slider visual state'
          git push origin HEAD:main

      - name: Verify FTP secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FTP_USER:-}" ]]
          [[ -n "${FTP_PASSWORD:-}" ]]

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload patched prototype
        shell: bash
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-allow no; set net:max-retries 4; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST\"; set cmd:fail-exit no; mkdir -p \"$REMOTE_DIR\"; set cmd:fail-exit yes; put -O \"$REMOTE_DIR/\" priolens/open14-rank-v02/index.html"

      - name: Live smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 'https://omesg360.eu/priolens-open14-rank-v02/' -o /tmp/live
          grep -Fq 'input.noValue{-webkit-appearance:none' /tmp/live
          grep -Fq 'OWNER · Rank v0.2' /tmp/live
          echo 'PASS: unanswered slider has neutral custom track; rank v0.2 live'
