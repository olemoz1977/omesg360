<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0f0f13">
<title>ConflictLab — Wave 1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f13; color: #e8e4df;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .screen { display: none; width: 100%; max-width: 480px; padding: 16px; }
  .screen.active { display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 1.4rem; font-weight: 600; text-align: center; }
  p  { font-size: 0.95rem; color: #aaa; line-height: 1.6; text-align: center; }
  a { color:#9fdbb7; }
  .pair-grid { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .pair-option {
    cursor: pointer; border: 2px solid transparent;
    border-radius: 10px; overflow: hidden; transition: border-color 0.15s;
    position: relative;
  }
  .pair-option:hover { border-color: #555; }
  .pair-option.selected { border-color: #7ecfa0; }
  .pair-option img { width: 100%; aspect-ratio: 1/1; object-fit: contain; display: block; border-radius: 8px; }
  .pair-option .loading-overlay {
    position: absolute; inset: 0; background: #1a1a22;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; color: #777; border-radius: 8px;
  }
  .btn {
    padding: 14px; border: none; border-radius: 8px;
    font-size: 1rem; cursor: pointer; font-weight: 600; width: 100%;
  }
  .btn-primary { background: #7ecfa0; color: #0f0f13; }
  .btn-ghost   { background: transparent; border: 1px solid #444; color: #aaa; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  textarea {
    width: 100%; background: #1a1a22; border: 1px solid #333;
    border-radius: 8px; color: #e8e4df; padding: 12px;
    font-size: 0.9rem; resize: vertical; min-height: 80px;
  }
  textarea::placeholder { color: #666; }
  .intensity-row { display: flex; gap: 8px; justify-content: center; }
  .intensity-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid #444; background: #1a1a22;
    color: #aaa; font-size: 0.9rem; cursor: pointer; font-weight: 600;
  }
  .intensity-btn.selected { background: #7ecfa0; color: #0f0f13; border-color: #7ecfa0; }
  .progress { text-align: center; font-size: 0.8rem; color: #666; }
  .label-small { font-size: 0.8rem; color: #888; text-align: center; margin-bottom: 8px; }
  .done-icon { font-size: 3rem; text-align: center; }
  .reason-label { font-size: 0.85rem; color: #aaa; line-height: 1.5; text-align: center; }
  .reason-toggle {
    padding: 12px; border-radius: 8px; border: 1px solid #444;
    background: transparent; color: #aaa; font-size: 0.9rem;
    cursor: pointer; width: 100%;
  }
  .reason-toggle.selected {
    border-color: #7ecfa0; color: #7ecfa0; background: rgba(126,207,160,0.08);
  }
  .lang-switch {
    display:flex; gap:6px; justify-content:center; margin-bottom:2px;
  }
  .lang-btn {
    width:auto; min-width:58px; padding:8px 12px; border-radius:999px;
    border:1px solid #3e3e48; background:#18181f; color:#aaa;
    cursor:pointer; font-weight:700; font-size:.82rem;
  }
  .lang-btn.active { background:#7ecfa0; color:#0f0f13; border-color:#7ecfa0; }
  .privacy-note {
    font-size:.78rem; color:#777; line-height:1.55; text-align:center;
    padding-top:2px;
  }
  .privacy-note a { color:#9aa; text-underline-offset:2px; }
  .protocol-note { font-size:.7rem; color:#50505a; text-align:center; }
</style>
</head>
<body>

<!-- INTRO -->
<div class="screen active" id="screen-intro">
  <div class="lang-switch" aria-label="Language">
    <button class="lang-btn" id="lang-lt" type="button" onclick="setLanguage('lt')">LT</button>
    <button class="lang-btn" id="lang-en" type="button" onclick="setLanguage('en')">EN</button>
  </div>
  <h1 data-i18n="intro.title">Vaizdų pasirinkimas</h1>
  <p data-i18n="intro.p1">Pamatysi kelias vaizdų poras. Kiekvienoje poroje pasirink vieną vaizdą.</p>
  <p data-i18n="intro.p2">Nėra teisingų ar neteisingų atsakymų.</p>
  <button class="btn btn-primary" id="start-btn" onclick="startSession()" data-i18n="intro.start">Pradėti</button>
  <p class="privacy-note" id="privacy-note"></p>
  <div class="protocol-note">ConflictLab · Wave 1 · v0.4</div>
</div>

<!-- PAIR -->
<div class="screen" id="screen-pair">
  <div class="progress" id="progress-text"></div>
  <p class="reason-label" data-i18n="pair.prompt">Kurį renkiesi?</p>
  <div class="pair-grid">
    <div class="pair-option" id="opt-left" onclick="selectOption('left')">
      <div class="loading-overlay" id="load-left" data-i18n="pair.loading">Kraunama...</div>
      <img id="img-left" src="" alt="" style="display:none">
    </div>
    <div class="pair-option" id="opt-right" onclick="selectOption('right')">
      <div class="loading-overlay" id="load-right" data-i18n="pair.loading">Kraunama...</div>
      <img id="img-right" src="" alt="" style="display:none">
    </div>
  </div>
  <button class="btn btn-ghost" onclick="selectOption('no_clear_choice')" data-i18n="pair.ncc">Neturiu aiškaus pasirinkimo</button>
  <button class="btn btn-primary" id="btn-next" onclick="goNext()" disabled data-i18n="common.next">Toliau</button>
</div>

<!-- REASON -->
<div class="screen" id="screen-reason">
  <p class="reason-label" id="reason-question"></p>
  <textarea id="free-text"></textarea>
  <button class="reason-toggle" id="hard-reason" onclick="toggleHardToIdentify('reason')" data-i18n="reason.hard">Sunku įvardyti priežastį</button>
  <div>
    <div class="label-small" id="intensity-label"></div>
    <div class="intensity-row" id="intensity-row">
      <button class="intensity-btn" onclick="setIntensity(1)">1</button>
      <button class="intensity-btn" onclick="setIntensity(2)">2</button>
      <button class="intensity-btn" onclick="setIntensity(3)">3</button>
      <button class="intensity-btn" onclick="setIntensity(4)">4</button>
      <button class="intensity-btn" onclick="setIntensity(5)">5</button>
    </div>
  </div>
  <button class="btn btn-primary" id="btn-save-reason" onclick="submitReason()" data-i18n="reason.save">Išsaugoti ir tęsti</button>
</div>

<!-- REASON-NCC -->
<div class="screen" id="screen-reason-ncc">
  <p class="reason-label" id="reason-ncc-question"></p>
  <textarea id="free-text-ncc"></textarea>
  <button class="reason-toggle" id="hard-ncc" onclick="toggleHardToIdentify('ncc')" data-i18n="reason.hard">Sunku įvardyti priežastį</button>
  <button class="btn btn-primary" id="btn-save-ncc" onclick="submitNCC()" data-i18n="reason.save">Išsaugoti ir tęsti</button>
</div>

<!-- DONE -->
<div class="screen" id="screen-done">
  <div class="done-icon">✓</div>
  <h1 data-i18n="done.title">Ačiū</h1>
  <p data-i18n="done.p">Tavo atsakymai išsaugoti.</p>
  <p class="privacy-note"><a id="done-privacy-link" href="/privacy.html?lang=lt" data-i18n="privacy.link">Privatumo politika</a></p>
</div>

<script>
const API          = 'api.php';
const ASSET_BASE   = 'assets/';
const PROTOCOL_VER = 'wave1-v0.4';

const PAIRS = [
  { id:'CS-PR-01', a:'more-reveal.webp',         b:'less-reveal.jpg'          },
  { id:'CS-RE-01', a:'more-evidence.png',        b:'less-evidence.png'        },
  { id:'CS-CA-01', a:'more-reference.png',       b:'less-reference.png'       },
  { id:'CR-PZ-01', a:'no-predefined-zones.png',  b:'predefined-zones.png'     },
  { id:'CR-FS-01', a:'fixed-slots.png',          b:'continuous-capacity.png'  },
  { id:'CR-PO-01', a:'partitioned-space.png',    b:'open-space.png'           },
];

const I18N = {
  lt: {
    'intro.title':'Vaizdų pasirinkimas',
    'intro.p1':'Pamatysi kelias vaizdų poras. Kiekvienoje poroje pasirink vieną vaizdą.',
    'intro.p2':'Nėra teisingų ar neteisingų atsakymų.',
    'intro.start':'Pradėti',
    'privacy.prefix':'Dalyvavimas savanoriškas. Eksperimentas saugo pseudoniminį sesijos ID, pasirinkimus, atsako laiką ir tavo neprivalomai pateiktą tekstą.',
    'privacy.link':'Privatumo politika',
    'pair.prompt':'Kurį renkiesi?',
    'pair.loading':'Kraunama...',
    'pair.loadError':'Nepavyko įkelti vaizdo. Perkrauk puslapį.',
    'pair.ncc':'Neturiu aiškaus pasirinkimo',
    'common.next':'Toliau',
    'reason.question':'Kas labiausiai nulėmė tavo pasirinkimą?',
    'reason.questionNcc':'Kas labiausiai nulėmė, kad neturėjai aiškaus pasirinkimo?',
    'reason.optional':'(neprivaloma)',
    'reason.placeholder':'Jei nori — keli žodžiai...',
    'reason.hard':'Sunku įvardyti priežastį',
    'reason.intensity':'Reakcijos stiprumas',
    'reason.save':'Išsaugoti ir tęsti',
    'done.title':'Ačiū',
    'done.p':'Tavo atsakymai išsaugoti.',
    'error.save':'Nepavyko išsaugoti atsakymo. Patikrink ryšį ir bandyk dar kartą.'
  },
  en: {
    'intro.title':'Image choice',
    'intro.p1':'You will see several pairs of images. In each pair, choose one image.',
    'intro.p2':'There are no right or wrong answers.',
    'intro.start':'Start',
    'privacy.prefix':'Participation is voluntary. The experiment stores a pseudonymous session ID, your choices, response time, and any optional text you provide.',
    'privacy.link':'Privacy Policy',
    'pair.prompt':'Which one do you choose?',
    'pair.loading':'Loading...',
    'pair.loadError':'The image could not be loaded. Please reload the page.',
    'pair.ncc':'I do not have a clear choice',
    'common.next':'Next',
    'reason.question':'What most influenced your choice?',
    'reason.questionNcc':'What most influenced the fact that you did not have a clear choice?',
    'reason.optional':'(optional)',
    'reason.placeholder':'If you want — a few words...',
    'reason.hard':'Hard to identify the reason',
    'reason.intensity':'Reaction intensity',
    'reason.save':'Save and continue',
    'done.title':'Thank you',
    'done.p':'Your responses have been saved.',
    'error.save':'Your response could not be saved. Check your connection and try again.'
  }
};

function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function uuidv4() {
  return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c/4).toString(16));
}

function t(key) {
  return (I18N[currentLanguage] && I18N[currentLanguage][key]) || key;
}

let currentLanguage = 'lt';
let participantId, queue, current;
let choiceMade = null, leftAsset, rightAsset;
let intensity = null, pairStart = null, imagesLoaded = 0;
let pairReady = false;
let presentationIndex = 0;
let submitting = false;
let hardReason = false;
let hardNcc = false;

function setLanguage(lang, updateUrl = true) {
  if (!I18N[lang]) lang = 'lt';
  currentLanguage = lang;
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (I18N[lang][key] !== undefined) el.textContent = I18N[lang][key];
  });

  document.getElementById('lang-lt').classList.toggle('active', lang === 'lt');
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  document.getElementById('lang-lt').setAttribute('aria-pressed', lang === 'lt' ? 'true' : 'false');
  document.getElementById('lang-en').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');

  const privacyUrl = `/privacy.html?lang=${lang}`;
  document.getElementById('privacy-note').innerHTML =
    `${t('privacy.prefix')} <a href="${privacyUrl}" target="_blank" rel="noopener">${t('privacy.link')}</a>`;
  document.getElementById('done-privacy-link').href = privacyUrl;

  document.getElementById('reason-question').innerHTML =
    `${t('reason.question')} <span style="color:#666">${t('reason.optional')}</span>`;
  document.getElementById('reason-ncc-question').innerHTML =
    `${t('reason.questionNcc')} <span style="color:#666">${t('reason.optional')}</span>`;
  document.getElementById('intensity-label').innerHTML =
    `${t('reason.intensity')} <span style="color:#666">${t('reason.optional')}</span>`;
  document.getElementById('free-text').placeholder = t('reason.placeholder');
  document.getElementById('free-text-ncc').placeholder = t('reason.placeholder');

  if (updateUrl && window.history && window.history.replaceState) {
    const url = new URL(window.location.href);
    url.searchParams.set('lang', lang);
    window.history.replaceState({}, '', url);
  }
}

function startSession() {
  participantId = uuidv4();
  queue = shuffle([...PAIRS]);
  presentationIndex = 0;
  showScreen('screen-pair');
  loadPair();
}

function loadPair() {
  if (queue.length === 0) { showScreen('screen-done'); return; }
  current = queue.shift();
  presentationIndex++;

  const flip = Math.random() < 0.5;
  leftAsset  = flip ? current.b : current.a;
  rightAsset = flip ? current.a : current.b;

  choiceMade = null;
  intensity  = null;
  pairStart  = null;
  imagesLoaded = 0;
  pairReady = false;

  document.getElementById('opt-left').classList.remove('selected');
  document.getElementById('opt-right').classList.remove('selected');
  document.getElementById('btn-next').disabled = true;

  const done = PAIRS.length - queue.length - 1;
  document.getElementById('progress-text').textContent = `${done+1} / ${PAIRS.length}`;

  ['left','right'].forEach(s => {
    const overlay = document.getElementById(`load-${s}`);
    overlay.textContent = t('pair.loading');
    overlay.style.display = 'flex';
    document.getElementById(`img-${s}`).style.display = 'none';
  });

  function onLoad(side) {
    document.getElementById(`load-${side}`).style.display = 'none';
    document.getElementById(`img-${side}`).style.display  = 'block';
    imagesLoaded++;
    if (imagesLoaded === 2) {
      pairReady = true;
      pairStart = Date.now();
    }
  }

  function onImageError(side) {
    pairReady = false;
    pairStart = null;
    const overlay = document.getElementById(`load-${side}`);
    overlay.textContent = t('pair.loadError');
    overlay.style.display = 'flex';
    document.getElementById(`img-${side}`).style.display = 'none';
  }

  ['left','right'].forEach(side => {
    const img  = document.getElementById(`img-${side}`);
    const asset = side === 'left' ? leftAsset : rightAsset;
    img.onload  = () => onLoad(side);
    img.onerror = () => onImageError(side);
    img.src = `${ASSET_BASE}${current.id}/${asset}`;
  });
}

function selectOption(side) {
  if (!pairReady) return;
  choiceMade = side;
  document.getElementById('opt-left').classList.toggle('selected',  side === 'left');
  document.getElementById('opt-right').classList.toggle('selected', side === 'right');
  document.getElementById('btn-next').disabled = false;
}

function goNext() {
  if (!choiceMade || submitting) return;

  const latency = pairStart ? Date.now() - pairStart : null;

  window._pending = {
    participant_id:     participantId,
    candidate_id:       current.id,
    protocol_version:   PROTOCOL_VER,
    language:           currentLanguage,
    presentation_index: presentationIndex,
    left_asset:         leftAsset,
    right_asset:        rightAsset,
    choice:             choiceMade,
    latency_ms:         latency,
  };

  if (choiceMade === 'no_clear_choice') {
    document.getElementById('free-text-ncc').value = '';
    hardNcc = false;
    document.getElementById('hard-ncc').classList.remove('selected');
    document.getElementById('free-text-ncc').disabled = false;
    showScreen('screen-reason-ncc');
  } else {
    document.getElementById('free-text').value = '';
    hardReason = false;
    document.getElementById('hard-reason').classList.remove('selected');
    document.getElementById('free-text').disabled = false;
    intensity = null;
    document.querySelectorAll('.intensity-btn').forEach(b => b.classList.remove('selected'));
    showScreen('screen-reason');
  }
}

function setIntensity(val) {
  intensity = val;
  document.querySelectorAll('.intensity-btn').forEach((b,i) => {
    b.classList.toggle('selected', i+1 === val);
  });
}

function toggleHardToIdentify(which) {
  if (which === 'reason') {
    hardReason = !hardReason;
    const btn = document.getElementById('hard-reason');
    const ta  = document.getElementById('free-text');
    btn.classList.toggle('selected', hardReason);
    ta.disabled = hardReason;
    if (hardReason) ta.value = '';
  } else {
    hardNcc = !hardNcc;
    const btn = document.getElementById('hard-ncc');
    const ta  = document.getElementById('free-text-ncc');
    btn.classList.toggle('selected', hardNcc);
    ta.disabled = hardNcc;
    if (hardNcc) ta.value = '';
  }
}

function submitReason() {
  if (submitting) return;
  submitting = true;

  const payload = {
    ...window._pending,
    free_text:        hardReason ? null : (document.getElementById('free-text').value.trim() || null),
    intensity:        intensity,
    hard_to_identify: hardReason ? 1 : 0,
  };

  sendResponse(payload, () => {
    submitting = false;
    showScreen('screen-pair');
    loadPair();
  }, () => {
    submitting = false;
  });
}

function submitNCC() {
  if (submitting) return;
  submitting = true;

  const payload = {
    ...window._pending,
    free_text:        hardNcc ? null : (document.getElementById('free-text-ncc').value.trim() || null),
    intensity:        null,
    hard_to_identify: hardNcc ? 1 : 0,
  };

  sendResponse(payload, () => {
    submitting = false;
    showScreen('screen-pair');
    loadPair();
  }, () => {
    submitting = false;
  });
}

function sendResponse(payload, onDone, onError) {
  fetch(API, {
    method:  'POST',
    headers: {'Content-Type': 'application/json'},
    body:    JSON.stringify(payload),
  })
  .then(async response => {
    let data = null;
    try { data = await response.json(); } catch (_) {}

    if (!response.ok || !data || data.status !== 'ok') {
      throw new Error((data && data.message) ? data.message : `HTTP ${response.status}`);
    }

    if (onDone) onDone(data);
  })
  .catch(err => {
    console.error('Save error:', err);
    alert(t('error.save'));
    if (onError) onError(err);
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

(function initLanguage() {
  const requested = new URLSearchParams(window.location.search).get('lang');
  const browserLang = (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'lt';
  setLanguage(I18N[requested] ? requested : browserLang, false);
})();
</script>
</body>
</html>
